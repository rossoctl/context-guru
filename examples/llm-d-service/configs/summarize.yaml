# Config 3 — whole-transcript summarizer (the summarize component).
#
# A cheap LLM compresses the middle of a long conversation into a single summary
# message, keeping msg0 (system/first) plus the last few turns verbatim. Best for
# long agentic sessions where the transcript itself is the token cost. Marker
# mode "off" + store disabled makes it irreversible: the summarized span is
# replaced outright, no <<cg:…>> markers, nothing stashed.
pipeline: [summarize]

components:
  summarize:
    summary_level: regular    # concise | regular | highly_detailed
    keep_last: 3              # turns kept verbatim at the tail
    min_tokens: 500           # min span size worth summarizing
    resummarize_tokens: 6000  # roll the summary forward once the fresh tail exceeds this
    marker_mode: "off"
    trigger:
      min_messages: 12            # don't summarize short conversations
      min_request_tokens: 40000   # …or small ones
      # OPTING OUT OF THE SHIPPED DEFAULT, and this is the configuration that has to.
      #
      # By default summarize fires when the transcript reaches 0.9 of C — the point at which the
      # client's own compaction would act. That default assumes there IS such a client: Claude
      # Code runs its own compaction as it nears its budget.
      #
      # This config drives a raw endpoint, so nothing else caps the context and 0.9 of a window
      # we may be guessing at is not a threshold worth trusting. `min_request_frac: 0` drops the
      # fraction and leaves the absolute size gates above as the only ones (0.9 of the window
      # would dwarf 40000 anyway).
      #
      # `cache_state` is not set: it defaults to `any`, which is what this deployment wants. It
      # used to be written here as an opt-out, back when the default waited for the prompt cache
      # to be near expiry or already expired. That default was withdrawn — the wait cost more
      # than it saved — so the opt-out is now the default and the line is gone.
      min_request_frac: 0
    model:
      source: config
      provider: openai
      base_url: http://your-llm-endpoint:8000
      model: gpt-4o-mini
      api_key: ""

store:
  enabled: false
