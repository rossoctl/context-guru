# = configs/summarize.yaml with triggers lowered for the small sample.
#
# min_request_frac carries the same opt-out as configs/summarize.yaml, and the sample needs it more
# than the real config does: the shipped fraction fires near 0.9 of C, and a four-message sample
# never reaches it. Without the opt-out this demo would show summarize doing nothing at all.
# cache_state is left unset — it defaults to `any`, which is what a demo wants.
pipeline: [summarize]
components:
  summarize: { summary_level: concise, keep_last: 2, min_tokens: 50, marker_mode: "off",
               trigger: { min_messages: 4, min_request_frac: 0 },
               model: { source: config } }
store: { enabled: false }
