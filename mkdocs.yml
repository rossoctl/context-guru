site_name: context-guru
site_description: >-
  Provider-agnostic context engineering for LLM agents — shrink the tokens a
  request carries, losslessly or lossy-but-reversibly, without touching the agent.
site_url: https://rossoctl.github.io/context-guru/
repo_url: https://github.com/rossoctl/context-guru
repo_name: rossoctl/context-guru
edit_uri: edit/main/docs/
copyright: >-
  Apache-2.0 &middot; a <a href="https://github.com/rossoctl">Rossoctl</a> platform component

# The site ships its own theme — `theme/` — rather than Material for MkDocs.
# It is the design system already in production on the sibling cap-evolve site:
# dark-first CSS custom properties with a light override on `html[data-theme]`,
# one hand-written stylesheet, one small vanilla-JS file, no framework. MkDocs
# core stays as the Markdown engine, so `docs/**/*.md` is still the only source
# of prose and every page's nav, TOC and search index is still generated.
theme:
  name: null
  custom_dir: theme
  locale: en
  logo: img/context-guru.png
  favicon: img/context-guru.png
  # `name: null` means MkDocs never reads a `mkdocs_theme.yml`, so a theme's own
  # options have to live here.
  static_templates:
    - 404.html
  # The search plugin ships only its index. The search UI is a ~70-line overlay in
  # theme/js/site.js reading search/search_index.json directly, so there is no
  # lunr.js bundle, no web worker and no standalone /search/ page.
  include_search_page: false
  search_index_only: true
  # One-line announcement bar. Keep it factual and keep it to one clause.
  announce: >-
    SWE-bench Verified, live, four arms: <strong>13% cheaper</strong> than no
    compaction, and the highest reward.

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Wraps every generated <table> in a scroll container. A wide results table has to
# scroll inside its own column, not push the page body sideways, and no author
# should have to remember an HTML wrapper to get that.
hooks:
  - theme/hooks.py

# Fail the build on a link that points at nothing, not just on a bad config.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# docs/superpowers/ holds working plans/specs for the skill that authored them, not
# published site content — keep it out of the nav-completeness check above.
#
# docs/proposals/ is the same category and excluded for the same reason: design rationale
# addressed to whoever changes the code next, not to whoever runs it. sweep-adjudicator.md, for
# instance, argues against an earlier version of its own design and records which measurements
# refuted it — useful in review, actively confusing on a page a user reaches looking for how to
# configure something. Excluded rather than added to the nav so `mkdocs build --strict` stays
# green without publishing internal argument, and so a proposal can be added without a nav edit.
exclude_docs: |
  superpowers/
  proposals/

# Nav mirrors how people arrive: install it the easy way and see what it saves
# (Get started) → run it yourself instead of the plugin (Advanced /
# Self-hosting) → understand it (Concepts) → look a component up (Components)
# → run it a particular way (Modes, Dashboard, Hosted) → check the claims
# (Results) → wire it in (Integrations). Every page under docs/ appears exactly
# once.
