          - dedup: components/dedup.md
          - collapse: components/collapse.md
          - failed_run: components/failed_run.md
          - cmdfilter: components/cmdfilter.md
          - extract: components/extract.md
          - extract_llm: components/extract_llm.md
          - smartcrush: components/smartcrush.md
          - mask: components/mask.md
