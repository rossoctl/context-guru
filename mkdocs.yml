      - "Co-reference reachability (measurement)": results/coref-reachability.md
      - "Co-reference on the eval box": results/coref-evalbox.md
      - "What actually fires (component gating)": results/component-gating.md
      - "coref on LOCA-bench": results/coref-loca.md
      - "SWE-bench Verified: per-arm detail":
