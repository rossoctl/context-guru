site_name: context-guru
site_description: >-
  Provider-agnostic context engineering for LLM agents — shrink the tokens a
  request carries, losslessly or lossy-but-reversibly, without touching the agent.
site_url: https://rossoctl.github.io/context-guru/
repo_url: https://github.com/rossoctl/context-guru
repo_name: rossoctl/context-guru
edit_uri: edit/main/docs/
copyright: >-
  Apache-2.0 &middot; a <a href="https://github.com/rossoctl">Rossoctl</a> platform component

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/context-guru.png
  favicon: img/context-guru.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  # `font: false` suppresses Material's <link> to fonts.googleapis.com. Setting
  # `text:`/`code:` here would put a stylesheet and a woff2 fetch from Google on
  # every page load of a static site — a third-party request per visitor, and a
  # blank first paint anywhere that host is unreachable. Inter and JetBrains Mono
  # are still asked for first in docs/stylesheets/extra.css, from the local system,
  # ahead of the platform stack.
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# No CDN and no JS of our own: one stylesheet on top of the theme, so the site
# builds and serves identically on GitHub Pages and from a local `mkdocs serve`.
# Material's own bundle is served from the site itself; the one request it can make
# to another host is unpkg.com for mermaid, and only on a page that has a diagram.
extra_css:
  - stylesheets/extra.css

# Fail the build on a link that points at nothing, not just on a bad config.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossoctl/context-guru
    - icon: fontawesome/brands/golang
      link: https://pkg.go.dev/github.com/rossoctl/context-guru

