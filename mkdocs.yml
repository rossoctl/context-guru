      - "Quickstart: proxy": get-started/quickstart-proxy.md
      - "Quickstart: compaction service": get-started/quickstart-compaction.md
      - Use with Claude Code: how-to/use-with-claude-code.md
      - Build & evaluate locally: setup.md
  - Concepts:
      - Architecture: design.md
      - Reversibility & recovery: how-to/recover-context.md
      - Agent compaction (Claude Code & Bob): how-to/agent-compaction.md
      - Measuring savings: how-to/measure-savings.md
  - Components:
      - Overview: components.md
      - Choose a preset: how-to/choose-a-preset.md
      - Preset reference: reference/presets.md
      - Reformat:
