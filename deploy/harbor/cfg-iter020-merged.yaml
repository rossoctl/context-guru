# iter020 arm: the merged design run as SPECIFIED for the first time.
#
# Three changes from iter018's s14, all from docs/experiments/loca/iter019/results.md:
#
#  1. min_tokens 3000 -> 800. iter018 offered the model 2.63 candidates per call. Bulk adjudication
#     is a COMPARATIVE mechanism and was measured at ~15; at 2.63 it is close to the per-output
#     design refuted at 6% live-kept. Measured offline: at batch 3-6 the model dropped a
#     genuinely-spent output only 2/4 of the time, at batch 10 it cleared 100% of them. Small
#     batches do not make it wrong, they make it unwilling to act -- which is what iter018's 94.6%
#     keep rate looks like from the inside.
#
#  2. the contract now states the SPENT criterion (current step / unfinished user instruction /
#     agent's own stated next step) and REQUIRES the model to name and quote the obligation.
#     Stating the criterion alone was measured inert (4/4 false drops); requiring the evidence
#     halved it. Code change, internal/extract/bulk.go.
#
#  3. trim is gone. Chosen zero times in 21 offline opportunities; in production accepted once
#     against eight rejected as invented.
#
# model stays on the cheap client. Reading the real context via a cache-read on the request model
# is buildable and cheap (iter019 section 2) but the capability it was meant to enable -- the
# Tier-2 veto -- did not appear, so it is deliberately NOT bundled into this arm. One variable
# cluster at a time.
pipeline: [format, extract_llm, summarize]
components:
  extract_llm:
    selection_mode: merged
    strategy: code
    model: {source: config}
    min_tokens: 800
    allow_on_caching_backend: true
    allow_cached_prefix: true
    # AMENDED MID-RUN, on the pre-registered abort criterion and before any outcome data.
    #
    # The first launch reached only 1.93 candidates per call at 213 requests with acted=0, and the
    # counters named the cause: the economic gate SUPPRESSED 1,497 candidates against 224 that
    # reached the model, top reason "cache-aware, saving below call cost".
    #
    # That gate prices each candidate's expected saving against the cost of A WHOLE MODEL CALL,
    # which is right for the per-output loop where candidate == call. In merged mode there is ONE
    # call regardless of batch size, so the marginal cost of adding a candidate is a few prompt
    # tokens. The gate therefore suppresses exactly the candidates that would make the batch
    # bulk-sized -- and it fights min_tokens directly: a lower floor yields smaller candidates,
    # each of which looks even less worth "a call".
    #
    # This is the THIRD instance of one class of defect (prefix pre-filter, llm_max_per_request,
    # now this): cost machinery written for per-output calls, applied to a one-call design. The
    # correct fix is to amortise one call across the batch in merged mode; that is only worth
    # building if bulk batches improve yield, which is what this run exists to answer. So the gate
    # is disabled HERE, for a run that was pre-registered as mechanism-only and never going to make
    # a cost claim. Calls do not multiply with candidates in merged mode, so the added spend is
    # prompt tokens only.
    economic_gate: false
  summarize:
    trigger: {min_request_frac: 0.78}
    resummarize_tokens: 20000
    min_tokens: 500
    keep_last: 3
    model: {source: config}
