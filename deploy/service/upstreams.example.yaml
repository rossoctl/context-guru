# context-guru hosted mode: the operator's upstream allow-list.
#
# Passing --upstreams <this file> is what switches the proxy from a single-tenant
# dev tool into a hosted service. From then on every request needs a context-guru
# token, and each tenant's own configuration decides its pipeline.
#
# A tenant chooses an upstream by NAME, from this file. It can never supply a URL:
# that would make the proxy an unauthenticated forwarder to anything this host's
# network can reach.
#
# NO CREDENTIAL IS CONFIGURED HERE, and by default none is used: the caller's own
# provider key is forwarded upstream, so each user's traffic is billed to their own
# account. A caller with no key of their own gets a 401 — never somebody else's key.
#
# `key_env: SOME_VAR` is the opt-in exception: it names an environment variable whose
# value REPLACES the caller's auth on forward, read at request time. Use it only for a
# gateway deployment where the agent holds a placeholder key (eval containers, a local
# single-tenant proxy). If you name a variable, it must be set, or the proxy refuses to
# start rather than silently forwarding a placeholder.
#
# The first entry of each dialect is the default a newly registered tenant gets, so
# the common case needs no choices at registration.

upstreams:
  # Claude Code and anything else speaking the Anthropic dialect.
  #   ANTHROPIC_BASE_URL=https://cg.<host>/anthropic
  - name: ibm-litellm
    dialect: anthropic
    base_url: https://REPLACE-WITH-IBM-GATEWAY-HOST

  # The same gateway over its OpenAI-dialect route, for Codex, tau2-bench, etc.
  #   OPENAI_BASE_URL=https://cg.<host>/openai/v1
  - name: ibm-litellm-openai
    dialect: openai
    base_url: https://REPLACE-WITH-IBM-GATEWAY-HOST

  # IBM Bob Shell. Bob's model call and its control-plane paths both route here.
  #   CUSTOM_BASE_URL=https://cg.<host>
  # `header` is only needed when a key_env'd upstream wants the key somewhere other
  # than this dialect's default (Authorization: Bearer for openai/bob, x-api-key for
  # anthropic).
  - name: bob-us-east
    dialect: bob
    base_url: https://api.us-east.bob.ibm.com
