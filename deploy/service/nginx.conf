# nginx front end for the hosted context-guru proxy.
#
#   install -m0644 nginx.conf /etc/nginx/conf.d/context-guru.conf
#   nginx -t && systemctl reload nginx
#
# Two settings here are load-bearing rather than stylistic, and getting either
# wrong looks like context-guru being broken:
#
#   proxy_buffering off    — the proxy streams SSE, both the provider's token stream
#                           to the agent and the dashboard's live feed. With
#                           buffering on, nginx holds the response and the agent
#                           waits for the whole answer while the dashboard shows
#                           nothing at all.
#   proxy_read_timeout     — an agent turn on a large transcript can exceed a minute
#                           and the SSE feed is open indefinitely. The default 60s
#                           severs both.

# Per-IP request limiting. The proxy applies its own per-TENANT limits; this is the
# outer bound, for a caller with no valid token at all.
limit_req_zone $binary_remote_addr zone=cg_ip:10m rate=30r/s;

upstream context_guru {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Grafana, reachable at /grafana/ behind the manager gate below. Loopback only on its own
# side; nginx is the only thing that can talk to it.
upstream cg_grafana {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Grafana's live-tail and its dashboard-save channel are WebSockets, so Upgrade has to be
# forwarded there — but only there. `Connection: upgrade` on a plain request breaks
# keepalive, hence the map rather than a flat value.
map $http_upgrade $cg_upgrade {
    default upgrade;
    ''      close;
}

# There is deliberately NO port 80 server block, and adding one would be a
# regression rather than a convenience.
#
# Every request to this service carries the user's `cg_live_...` token in a
# header. A 301 from http:// to https:// arrives *after* the client has already
# put that token on the wire in cleartext — the redirect cannot retract a
# credential that has already been sent. A mistyped `http://` must therefore fail
# to connect, which is the loudest and safest outcome: the user notices, fixes the
# URL, and the token was never exposed.
#
# This matches the firewall exception actually granted for the service: inbound
# TCP/443 only, port 80 not requested. If someone later opens 80 and re-adds a
# redirect here, the two changes together silently start leaking tokens.

server {
    # HTTP/2 is requested via the listen flag rather than the separate `http2 on;`
    # directive: that directive only exists in nginx 1.25.1+, and RHEL 9 ships
    # 1.20.1, where it is a hard config error. The flag form works on both (1.25+
    # logs a deprecation warning and honours it), so this stays portable.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/context-guru/tls/fullchain.pem;
    ssl_certificate_key /etc/context-guru/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:cg_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # No CSP header here: the dashboard sets its own strict one, and a second
    # policy from nginx would only ever be the weaker of the two.

    # Agent transcripts get large; the proxy caps a body at 32 MiB itself and
    # returns 413, so match that rather than letting nginx reject first with a
    # message the agent cannot explain.
    client_max_body_size 32m;

    access_log /var/log/nginx/context-guru.access.log;
    error_log  /var/log/nginx/context-guru.error.log;

    # ── Grafana, manager-gated ───────────────────────────────────────────────
    #
    # Grafana knows nothing about context-guru accounts, so authorization is asked of the
    # proxy before nginx forwards anything: GET /api/authz/grafana answers 204 for a
    # manager's `cg_dash` cookie and 401/403 for anyone else, reusing the same
    # webPrincipal + IsManager() the control plane uses. A refusal here means Grafana
    # never sees the request — not even its login page, which is the point: a login form
    # on the public internet is a password-guessing target, and this one guards every
    # tenant's spend.
    #
    # THE GATE IS ALSO THE SIGN-IN. The 204 carries the manager's address in
    # X-Cg-Grafana-User, and Grafana's auth-proxy signs that person in — Admin, account
    # created on first visit — so there is no second password to hold and no second idea of
    # who an administrator is. Grafana's own login form stays enabled behind this as a
    # break-glass path, and anonymous access is off.
    #
    # THAT HEADER IS A COMPLETE AUTHENTICATION, so it must never be a client's to set.
    # Three controls, and all three are needed:
    #   1. `auth_request_set` reads it from the SUBREQUEST's response, and the
    #      `proxy_set_header` below then defines the header on the proxied request. A
    #      defined header always replaces whatever the client sent, so a forged
    #      X-Cg-Grafana-User is overwritten — including with the empty string, when the
    #      gate declined to name anyone, which Grafana treats as "not signed in".
    #   2. The gate itself only ever names the owner of the cg_dash session it validated;
    #      it ignores any such header on the incoming request
    #      (proxy: TestGrafanaAuthzNamesTheSessionOwnerNotTheRequestsHeader).
    #   3. Grafana's auth_proxy_whitelist is 127.0.0.1/::1, so only this nginx can present
    #      the header at all — anything else reaching port 3000 is refused it.
    # Verify from outside after any change to this block: a request carrying its own
    # X-Cg-Grafana-User must still be 401 with no Grafana content in the body. See
    # deploy/grafana/README.md, "Proving the header cannot be forged".
    #
    # DEPLOY ORDER, and the one way this looks broken: /api/authz/grafana ships in the same
    # commit as this file, but nginx reloads in a second and the proxy only picks the route
    # up when it restarts. Against an older binary the path falls through to Bob's
    # catch-all, which answers 401 — so the gate fails CLOSED and even a manager gets 401
    # until the proxy has been restarted. Nothing to change here when it is.
    #
    # Probing the port cannot tell you which of the two answered: both refuse with the same
    # 401 and the same body, because the catch-all and gate share failAuth/errNoToken. Ask
    # the binary instead:
    #   grep -c api/authz/grafana /usr/local/bin/context-guru-proxy   # 0 = needs a deploy

    # The subrequest target. `internal` makes it unreachable from outside, and it
    # deliberately proxies to /api/authz/grafana rather than through /grafana/ — routing an
    # auth_request through the location it authorizes is an infinite subrequest loop.
    location = /_cg_authz_grafana {
        internal;
        proxy_pass http://context_guru/api/authz/grafana;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        # A subrequest carries no body, and saying so keeps nginx from waiting on one.
        proxy_pass_request_body off;
        proxy_set_header Content-Length  "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /grafana without the slash would otherwise fall through to `location /` and be
    # answered by the proxy's catch-all with an opaque 401.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        auth_request /_cg_authz_grafana;
        # Who the gate said this is. Read from the subrequest's response headers, never from
        # the client's request — see the three controls above.
        auth_request_set $cg_grafana_user $upstream_http_x_cg_grafana_user;

        # A dashboard's first paint is a burst of a few dozen assets, so the burst here is
        # larger than the API's. The rate is the same.
        limit_req zone=cg_ip burst=120 nodelay;

        # No trailing path: Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true
        # and expects to receive the /grafana prefix itself. Stripping it here would make
        # every asset URL it generates a 404.
        proxy_pass http://cg_grafana;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana's auth-proxy identity. UNCONDITIONAL: this line is what makes a client's
        # own X-Cg-Grafana-User irrelevant, so it must stay outside any `if` and must never
        # become `$http_x_cg_grafana_user`.
        proxy_set_header X-Cg-Grafana-User  $cg_grafana_user;
        # Live tail and the dashboard-save channel are WebSockets. See the map above.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $cg_upgrade;

        # Loki's live tail streams; buffered, the log panel shows nothing until it stops.
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        limit_req zone=cg_ip burst=60 nodelay;

        proxy_pass http://context_guru;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clear hop-by-hop upgrade headers rather than forwarding them: nothing here
        # speaks WebSocket, and SSE is plain HTTP.
        proxy_set_header Connection        "";

        # SSE. See the header comment — both of these are required, not tuning.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
