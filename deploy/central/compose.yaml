# The central stack on ONE machine, for development and for the end-to-end test.
#
#   docker compose -f deploy/central/compose.yaml up -d
#
# Production uses install.sh (see README.md): the same images and the same config files. This file
# differs in one way: it has no TLS. Do not expose it.
#
# Only the collector's two receiver ports, Prometheus and Grafana are published, all on loopback.
# Alertmanager stays on the private network.

name: central-metrics

services:
  otel-collector:
    image: ${OTELCOL_IMAGE:-otel/opentelemetry-collector-contrib:0.165.0}
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"   # Cortex proxies push here
      - "127.0.0.1:4319:4319"   # context-guru proxies push here
    depends_on: [prometheus]
    restart: unless-stopped

  prometheus:
    image: ${PROM_IMAGE:-prom/prometheus:v3.2.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-20GB}
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # for the test and for curl; remove in production
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.6.0}
    environment:
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Development only. Production seeds a random password (install.sh).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/central:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
