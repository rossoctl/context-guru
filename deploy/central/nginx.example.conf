# TLS front end for the collector. Example: copy it, then change the server name and the two
# certificate paths.
#
# The proxies refuse plain http to a remote host (R44), so every remote push needs this or an
# equivalent. The collector itself speaks plain HTTP on loopback; this terminates TLS in front of it.
#
# One public port serves both proxies, on two paths. The collector's receivers are separate (4318 for
# Cortex, 4319 for context-guru), and the path decides which one gets the push, so the collector
# sets the `proxy` label from it. Authentication is off today (see README.md).
#
# Also install central-proxy.inc beside this file (it holds the lines both locations share).
#
# Point each proxy at its own base URL:
#   Cortex:       https://metrics.example.com/cortex
#   context-guru: https://metrics.example.com/context-guru
# The proxy adds /v1/metrics to the URL.

map $http_upgrade $central_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name metrics.example.com;

    ssl_certificate     /etc/ssl/central/fullchain.pem;
    ssl_certificate_key /etc/ssl/central/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A push is a few kilobytes. A large body is not a push.
    client_max_body_size 4m;

    # Each proxy has its own location and its own upstream. The prefix is removed, and the
    # Authorization header is passed untouched. Nothing checks it today (see README.md).
    location /cortex/ {
        proxy_pass http://127.0.0.1:4318/;
        include /etc/nginx/central-proxy.inc;
    }
    location /context-guru/ {
        proxy_pass http://127.0.0.1:4319/;
        include /etc/nginx/central-proxy.inc;
    }

    # Grafana, behind its own login. Install with GRAFANA_ROOT_URL=https://<host>/grafana/: Grafana then
    # expects the /grafana prefix, so the path is passed through, not removed.
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live uses a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $central_upgrade;
    }

    # Nothing else is served.
    location / { return 404; }
}

# Port 80 serves nothing. A proxy that is pointed at http:// is refused by the proxy itself; an answer
# here would only invite a token to be sent in clear text.
server {
    listen 80 default_server;
    return 444;
}
