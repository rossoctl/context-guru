# OpenTelemetry Collector for the central metrics stack (contrib build; the core build has no
# remote-write exporter).
#
# Each proxy pushes OTLP/JSON over HTTPS. Two things are decided HERE and never taken from the
# sender:
#   1. which proxy sent the data. One receiver for each proxy (4318 Cortex, 4319 context-guru). The
#      `proxy` label is set per pipeline.
#   2. which labels exist. Only machine, preset, service_version and proxy are kept (metrics spec
#      5.6). A sender cannot add a label.
#
# AUTHENTICATION IS OFF. The receivers accept any push that reaches them. The only protection is that
# the receivers sit behind the TLS front end on a private network. A proxy may still send an
# Authorization header; it is ignored. The design for real authentication (tokens for each install,
# binding a token to a machine, mutual TLS, and how a consumer is given its credential) is tracked in
# the issue named in README.md. The token blocks are kept below, switched off, so that work can reuse
# them.
#
# TLS is terminated in front of this (the receivers listen on plain HTTP inside the private
# network). See README.md.

extensions:
  # --- authentication, switched off. To switch it on again, uncomment these two blocks, the `auth:`
  # --- lines in the receivers, and the two names in service.extensions, and use `install.sh token`.
  # bearertokenauth/cortex:
  #   scheme: Bearer
  #   filename: /etc/otelcol/tokens/cortex.txt
  # bearertokenauth/contextguru:
  #   scheme: Bearer
  #   filename: /etc/otelcol/tokens/context-guru.txt
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp/cortex:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # auth:
        #   authenticator: bearertokenauth/cortex
  otlp/contextguru:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        # auth:
        #   authenticator: bearertokenauth/contextguru

processors:
  # First in the chain: a burst from many machines must not stop the collector.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  transform/cortex:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["machine"], attributes["service.instance.id"])
          - keep_keys(attributes, ["machine", "preset", "service.version"])
          - set(attributes["proxy"], "cortex")
      # The scope name and version would become labels. They carry no information here.
      - context: scope
        statements:
          - set(name, "")
          - set(version, "")
  transform/contextguru:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["machine"], attributes["service.instance.id"])
          - keep_keys(attributes, ["machine", "preset", "service.version"])
          - set(attributes["proxy"], "context-guru")
      - context: scope
        statements:
          - set(name, "")
          - set(version, "")
  batch:
    timeout: 5s

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # Resource attributes become labels. Do not add a unit suffix: the metric names already carry
    # `usd`, `tokens` and `seconds` (spec 5.1).
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]   # + bearertokenauth/cortex, bearertokenauth/contextguru when authentication is on
  pipelines:
    metrics/cortex:
      receivers: [otlp/cortex]
      processors: [memory_limiter, transform/cortex, batch]
      exporters: [prometheusremotewrite]
    metrics/contextguru:
      receivers: [otlp/contextguru]
      processors: [memory_limiter, transform/contextguru, batch]
      exporters: [prometheusremotewrite]
  telemetry:
    # The collector's own metrics, for the pipeline alerts. Prometheus scrapes this port.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
