<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77700"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="590" y="24" text-anchor="middle" font-size="17" font-weight="bold">Inference metrics with OpenTelemetry (OTel) and Prometheus</text>

  <!-- Local machine 1 -->
  <g>
    <rect x="20" y="60" width="310" height="180" rx="8" fill="#f4f7fb" stroke="#7a8ca5" stroke-dasharray="5,4"/>
    <text x="30" y="78" font-size="12" fill="#555">Local machine 1</text>
    <g stroke="#333" stroke-width="2" fill="none"><circle cx="75" cy="100" r="8" fill="#fff"/><path d="M75,108 L75,128 M62,115 L88,115 M75,128 L65,140 M75,128 L85,140"/></g>
    <text x="75" y="154" text-anchor="middle">User</text>
    <rect x="135" y="90" width="80" height="50" rx="5" fill="#fff" stroke="#333"/>
    <text x="175" y="120" text-anchor="middle">Harness</text>
    <rect x="235" y="90" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="275" y="120" text-anchor="middle">Proxy</text>
    <path d="M100,115 L135,115" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M215,115 L235,115" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="135" y="175" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="175" y="197" text-anchor="middle">Proxy</text>
    <text x="175" y="213" text-anchor="middle">dashboard</text>
    <path d="M245,186 v28 a30,6 0 0 0 60,0 v-28" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <ellipse cx="275" cy="186" rx="30" ry="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <text x="275" y="207" text-anchor="middle" font-size="11">SQLite</text>
    <text x="275" y="236" text-anchor="middle" font-size="10" fill="#555">small local DB</text>
    <path d="M275,140 L275,174" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="283" y="160" font-size="10" fill="#555">writes</text>
    <path d="M245,202 L215,202" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230" y="196" text-anchor="middle" font-size="10" fill="#555">reads</text>
    <path d="M75,160 L75,200 L135,200" fill="none" stroke="#5e35b1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82" y="194" font-size="10" fill="#5e35b1">views</text>
  </g>

  <!-- Local machine 2 -->
  <g>
    <rect x="20" y="255" width="310" height="180" rx="8" fill="#f4f7fb" stroke="#7a8ca5" stroke-dasharray="5,4"/>
    <text x="30" y="273" font-size="12" fill="#555">Local machine 2</text>
    <g stroke="#333" stroke-width="2" fill="none"><circle cx="75" cy="295" r="8" fill="#fff"/><path d="M75,303 L75,323 M62,310 L88,310 M75,323 L65,335 M75,323 L85,335"/></g>
    <text x="75" y="349" text-anchor="middle">User</text>
    <rect x="135" y="285" width="80" height="50" rx="5" fill="#fff" stroke="#333"/>
    <text x="175" y="315" text-anchor="middle">Harness</text>
    <rect x="235" y="285" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="275" y="315" text-anchor="middle">Proxy</text>
    <path d="M100,310 L135,310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M215,310 L235,310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="135" y="370" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="175" y="392" text-anchor="middle">Proxy</text>
    <text x="175" y="408" text-anchor="middle">dashboard</text>
    <path d="M245,381 v28 a30,6 0 0 0 60,0 v-28" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <ellipse cx="275" cy="381" rx="30" ry="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <text x="275" y="402" text-anchor="middle" font-size="11">SQLite</text>
    <text x="275" y="431" text-anchor="middle" font-size="10" fill="#555">small local DB</text>
    <path d="M275,335 L275,369" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="283" y="355" font-size="10" fill="#555">writes</text>
    <path d="M245,397 L215,397" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230" y="391" text-anchor="middle" font-size="10" fill="#555">reads</text>
    <path d="M75,355 L75,395 L135,395" fill="none" stroke="#5e35b1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82" y="389" font-size="10" fill="#5e35b1">views</text>
  </g>

  <!-- Local machine N -->
  <g>
    <rect x="20" y="450" width="310" height="180" rx="8" fill="#f4f7fb" stroke="#7a8ca5" stroke-dasharray="5,4"/>
    <text x="30" y="468" font-size="12" fill="#555">Local machine N</text>
    <g stroke="#333" stroke-width="2" fill="none"><circle cx="75" cy="490" r="8" fill="#fff"/><path d="M75,498 L75,518 M62,505 L88,505 M75,518 L65,530 M75,518 L85,530"/></g>
    <text x="75" y="544" text-anchor="middle">User</text>
    <rect x="135" y="480" width="80" height="50" rx="5" fill="#fff" stroke="#333"/>
    <text x="175" y="510" text-anchor="middle">Harness</text>
    <rect x="235" y="480" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="275" y="510" text-anchor="middle">Proxy</text>
    <path d="M100,505 L135,505" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M215,505 L235,505" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="135" y="565" width="80" height="50" rx="5" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
    <text x="175" y="587" text-anchor="middle">Proxy</text>
    <text x="175" y="603" text-anchor="middle">dashboard</text>
    <path d="M245,576 v28 a30,6 0 0 0 60,0 v-28" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <ellipse cx="275" cy="576" rx="30" ry="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <text x="275" y="597" text-anchor="middle" font-size="11">SQLite</text>
    <text x="275" y="626" text-anchor="middle" font-size="10" fill="#555">small local DB</text>
    <path d="M275,530 L275,564" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="283" y="550" font-size="10" fill="#555">writes</text>
    <path d="M245,592 L215,592" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230" y="586" text-anchor="middle" font-size="10" fill="#555">reads</text>
    <path d="M75,550 L75,590 L135,590" fill="none" stroke="#5e35b1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82" y="584" font-size="10" fill="#5e35b1">views</text>
  </g>

  <!-- Step 1: inference requests to the LLM provider -->
  <rect x="840" y="60" width="200" height="60" rx="8" fill="#fff3e0" stroke="#c77700"/>
  <text x="940" y="86" text-anchor="middle" font-weight="bold">LLM provider</text>
  <text x="940" y="104" text-anchor="middle" font-size="12">hosted or self-hosted</text>
  <path d="M275,90 L275,52 L940,52 L940,60" fill="none" stroke="#c77700" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="600" y="46" text-anchor="middle" font-size="12" fill="#c77700">1. Each proxy sends inference requests (all machines do this)</text>

  <!-- Step 2: push to the collector -->
  <path d="M315,115 L400,115 L400,255 L510,255" fill="none" stroke="#1d6fb8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <path d="M315,310 L510,285" fill="none" stroke="#1d6fb8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <path d="M315,505 L400,505 L400,325 L510,325" fill="none" stroke="#1d6fb8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="345" y="105" font-size="12" fill="#1d6fb8">2. Proxy pushes metrics</text>
  <text x="408" y="150" font-size="12" fill="#1d6fb8">(OTLP over HTTPS,</text>
  <text x="408" y="166" font-size="12" fill="#1d6fb8">every ~30 s,</text>
  <text x="408" y="182" font-size="12" fill="#1d6fb8">outgoing only)</text>

  <!-- Central server -->
  <g transform="translate(60,0)">
    <rect x="430" y="195" width="550" height="310" rx="10" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="440" y="212" font-size="12" fill="#555">Central server (these four can run on one machine)</text>

    <rect x="450" y="215" width="180" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="540" y="240" text-anchor="middle" font-weight="bold">OTel Collector</text>
    <text x="540" y="262" text-anchor="middle" font-size="12">checks the token</text>
    <text x="540" y="280" text-anchor="middle" font-size="12">adds a machine label</text>
    <text x="540" y="298" text-anchor="middle" font-size="12">batches the data</text>

    <rect x="780" y="215" width="180" height="130" rx="8" fill="#fde8e4" stroke="#c62828" stroke-width="1.5"/>
    <text x="870" y="240" text-anchor="middle" font-weight="bold">Prometheus</text>
    <text x="870" y="262" text-anchor="middle" font-size="12">stores numbers with</text>
    <text x="870" y="280" text-anchor="middle" font-size="12">timestamps</text>
    <text x="870" y="298" text-anchor="middle" font-size="12">answers queries</text>

    <path d="M630,280 L780,280" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="705" y="262" text-anchor="middle" font-size="12">3. Collector pushes</text>
    <text x="705" y="300" text-anchor="middle" font-size="10" fill="#555">(remote write; no /metrics scrape)</text>

    <rect x="780" y="420" width="180" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="870" y="450" text-anchor="middle" font-weight="bold">Grafana</text>
    <text x="870" y="468" text-anchor="middle" font-size="12">charts and dashboards</text>
    <path d="M870,420 L870,345" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="880" y="388" font-size="12">4. Ask for data</text>

    <rect x="450" y="420" width="180" height="70" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
    <text x="540" y="450" text-anchor="middle" font-weight="bold">Alertmanager</text>
    <text x="540" y="468" text-anchor="middle" font-size="12">sends alerts (optional)</text>
    <path d="M780,325 L700,325 L700,455 L630,455" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="692" y="390" text-anchor="end" font-size="12" fill="#555">alert rules fire</text>

    <g stroke="#333" stroke-width="2" fill="none"><circle cx="1060" cy="430" r="8" fill="#fff"/><path d="M1060,438 L1060,458 M1047,445 L1073,445 M1060,458 L1050,470 M1060,458 L1070,470"/></g>
    <text x="1060" y="490" text-anchor="middle">Analysis user</text>
    <path d="M1035,455 L960,455" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1000" y="430" text-anchor="middle" font-size="12">5. Views</text>
    <text x="1000" y="444" text-anchor="middle" font-size="12">dashboards</text>
  </g>

  <text x="20" y="662" font-size="12" fill="#555">Solid arrow = data flow. Dashed arrow = optional. Arrows from the machines point outward, so firewalls and NAT do not block them.</text>
  <text x="20" y="680" font-size="12" fill="#5e35b1">Purple arrow = the user opens the proxy dashboard. It reads the small local SQLite DB that the proxy writes. This data stays on the machine.</text>
</svg>
