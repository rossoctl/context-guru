<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The idea in one change: cmdfilter shortens message 9 by 7,000 tokens</title>
<desc id="d">Two rows show the prompt of request 1, left to right. Messages 0 to 8 are 30,000 tokens and are read from the cache at 0.30 dollars per million. Message 9 is new, 8,000 tokens, and is written at 3.75 dollars per million. The first row is the prompt without the change and costs 0.03900 dollars. The second row is the prompt with the change: cmdfilter shortens message 9 to 1,000 tokens, so the hatched 7,000 tokens are not sent. It costs 0.01275 dollars. The saving is 0.02625 dollars.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.axis{stroke:var(--grid);stroke-width:1}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.sep{stroke:var(--surface);stroke-width:2}
</style>
<defs><pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hw" x1="0" y1="0" x2="0" y2="8"/></pattern></defs>
<rect class="bg" width="1100" height="430"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">The idea in one change: cmdfilter shortens message 9 by 7,000 tokens</text>
<text class="t2" x="24" y="50" font-size="12">Each row is the prompt of request 1, left to right; widths are in tokens. The hatched block is what cmdfilter removed.</text>
<text class="t" x="470.3" y="88" font-size="12" text-anchor="middle" font-weight="600">messages 0 to 8</text>
<text class="t2" x="470.3" y="102" font-size="11" text-anchor="middle">30,000 · cached by request 0</text>
<text class="t" x="825.3" y="88" font-size="12" text-anchor="middle" font-weight="600">9 (new)</text>
<text class="t2" x="825.3" y="102" font-size="11" text-anchor="middle">test-run output · 8,000</text>
<line class="guide" x1="750.5" y1="110" x2="750.5" y2="300"/>
<text class="t" x="24" y="136" font-size="14" font-weight="600">Without the change</text>
<text class="t2" x="24" y="150" font-size="11">30,000 + 8,000</text>
<text class="t2" x="24" y="163" font-size="11">38,000 tokens</text>
<rect class="read" x="190.0" y="120" width="560.5" height="40" rx="3"/>
<rect class="write" x="750.5" y="120" width="149.5" height="40" rx="3"/>
<line class="sep" x1="302.1" y1="120" x2="302.1" y2="160"/>
<line class="sep" x1="414.2" y1="120" x2="414.2" y2="160"/>
<line class="sep" x1="526.3" y1="120" x2="526.3" y2="160"/>
<line class="sep" x1="638.4" y1="120" x2="638.4" y2="160"/>
<text class="t" x="914" y="139" font-size="15" font-weight="600">$0.03900</text>
<text class="t2" x="914" y="155" font-size="11">30,000 × $0.30 + 8,000 × $3.75</text>
<text class="t" x="24" y="236" font-size="14" font-weight="600">With the change</text>
<text class="t2" x="24" y="250" font-size="11">cmdfilter on message 9</text>
<text class="t2" x="24" y="263" font-size="11">31,000 tokens</text>
<rect class="read" x="190.0" y="220" width="560.5" height="40" rx="3"/>
<rect class="write" x="750.5" y="220" width="18.7" height="40" rx="3"/>
<rect class="ghost-write" x="769.2" y="220" width="130.8" height="40" rx="3"/>
<line class="sep" x1="302.1" y1="220" x2="302.1" y2="260"/>
<line class="sep" x1="414.2" y1="220" x2="414.2" y2="260"/>
<line class="sep" x1="526.3" y1="220" x2="526.3" y2="260"/>
<line class="sep" x1="638.4" y1="220" x2="638.4" y2="260"/>
<text class="t" x="834.6" y="245" font-size="12" text-anchor="middle" font-weight="600">−7,000 saved</text>
<text class="t" x="914" y="239" font-size="15" font-weight="600">$0.01275</text>
<text class="t2" x="914" y="255" font-size="11">30,000 × $0.30 + 1,000 × $3.75</text>
<rect x="756.0" y="272" width="66.4" height="20" rx="10" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
<text class="t" x="789.2" y="286" font-size="12" text-anchor="middle" font-weight="600">rewrite</text>
<text class="t2" x="830.4" y="286" font-size="11">cmdfilter · message 9 · 8,000 → 1,000</text>
<line class="axis" x1="190" y1="314" x2="900" y2="314"/>
<line class="axis" x1="190.0" y1="314" x2="190.0" y2="320"/><text class="t2" x="190.0" y="334" font-size="11" text-anchor="middle">0</text>
<line class="axis" x1="376.8" y1="314" x2="376.8" y2="320"/><text class="t2" x="376.8" y="334" font-size="11" text-anchor="middle">10k</text>
<line class="axis" x1="563.7" y1="314" x2="563.7" y2="320"/><text class="t2" x="563.7" y="334" font-size="11" text-anchor="middle">20k</text>
<line class="axis" x1="750.5" y1="314" x2="750.5" y2="320"/><text class="t2" x="750.5" y="334" font-size="11" text-anchor="middle">30k</text>
<line class="axis" x1="900.0" y1="314" x2="900.0" y2="320"/><text class="t2" x="900.0" y="334" font-size="11" text-anchor="middle">38k</text>
<text class="t2" x="545.0" y="352" font-size="11" text-anchor="middle">position in the prompt, in tokens (k = 1,000)</text>
<text class="t" x="24" y="380" font-size="14" font-weight="600">Saving: $0.03900 − $0.01275 = $0.02625</text>
<rect class="read" x="24" y="396" width="22" height="12" rx="2"/><text class="t" x="56" y="406" font-size="12">cache read: $0.30 per million tokens</text>
<rect class="write" x="330" y="396" width="22" height="12" rx="2"/><text class="t" x="362" y="406" font-size="12">cache write: $3.75 per million tokens</text>
<rect class="ghost-write" x="640" y="396" width="22" height="12" rx="2"/><text class="t" x="672" y="406" font-size="12">tokens cmdfilter removed</text>
</svg>
