<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 550" width="1210" height="550" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The 7,000 tokens saved by one change, in three requests</title>
<desc id="d">Each row is a request. The horizontal axis is the prompt, in tokens, split by message. The 7,000 tokens that the change removed from message 9 are drawn as a hatched block in every request, at the same place. The block is blue where those tokens would have been read from the cache, and orange where they would have been written. Request 1 saves 0.02625 dollars, request 2 saves 0.00210 dollars, request 3 saves 0.02625 dollars, 0.05460 in total. A Compute column gives the tokens per tier for each request: 7,000 written, 7,000 read, 7,000 written. The total line multiplies them by the rates: 14,000 written at 3.75 dollars per million plus 7,000 read at 0.30 dollars per million is 0.05460 dollars. A column of reported context operations sits before the saving column; the rewrite is shown in the lane of request 1. The time between requests is written between the bars: 10 seconds, 1 minute and 20 minutes.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.ghost-read{fill:url(#hr);stroke:var(--read);stroke-width:1.5;stroke-dasharray:5 3}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hr{stroke:var(--read);stroke-width:1.5}.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.axis{stroke:var(--grid);stroke-width:1}
.pill{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:2}
.gap{stroke:var(--ink2);stroke-width:1.4}
</style>
<defs>
<pattern id="hr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hr" x1="0" y1="0" x2="0" y2="8"/></pattern>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hw" x1="0" y1="0" x2="0" y2="8"/></pattern>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
</defs>
<rect class="bg" width="1210" height="550"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">One change, three requests: the same 7,000 tokens are saved every time</text>
<text class="t2" x="24" y="50" font-size="12">Each row is a request. Left to right is the prompt, message by message; widths are in tokens. The hatched block is what the change removed.</text>
