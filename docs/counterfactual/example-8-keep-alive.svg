<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" width="1300" height="520" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">A keep-alive ping: without it and with it</title>
<desc id="d">Two panels. X is the position in the prompt, in tokens. Y is time in minutes, running down. Turn 9 is sent at minute 20, and the cache stays hot until minute 25. Left, no ping: turn 10 arrives at minute 28, after the entry expired, so it writes the complete context. Right, a ping at minute 24 keeps the cache hot until minute 29. Turn 10 at minute 28 reads the context of turn 9 and writes its new message.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834;--red:#d4292a}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926;--red:#ee5a5a}}
.bg{fill:var(--surface)}.read{fill:var(--read)}.last{fill:var(--red)}.write{fill:var(--write)}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.red{stroke:var(--red);stroke-width:5;stroke-linecap:round}
.redt{fill:var(--red)}
.dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.guide{stroke:var(--grid);stroke-width:1;stroke-dasharray:4 4}
.axis{stroke:var(--grid);stroke-width:1}
.sep{stroke:var(--surface);stroke-width:2}
</style>
<rect class="bg" width="1300" height="520"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">A keep-alive ping: without it and with it</text>
<text class="t2" x="24" y="50" font-size="12">Across: the prompt, in tokens. Down: time, in minutes. The cache entry lasts 5 minutes, so the entry made at minute 20 expires at 25.</text>
<text class="t" x="24" y="73" font-size="14" font-weight="600">Without a ping</text>
