<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 860" width="1110" height="860" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Context operations: thread level state and request level Compute</title>
<desc id="d">An agent sends a request, a black line. It passes through the plugins tool-prune, cpex, the context-guru plugin and possibly other plugins, then goes out to the upstream LLM. The response, a dashed black line, comes back to the agent below the plugins. Inside Cortex, the Tracker is a frame for one thread, at thread level. It holds the ThreadState: the active context operations, the previous fingerprint and the cache state, kept between requests. For each request there is a request record, at request level, that starts from a copy of the ThreadState. It holds the context operations reported now, the sizes, the breakpoints and the facts, and it has the Compute call. Eight numbered steps. 1: BeginRequest with the client body opens the record. 2: each plugin reports with Add. 3: EndRequest with the thread and the forwarded body ends the pass, and the record takes a copy of that thread's ThreadState. 4: the request goes upstream. 5: the response returns with the billed usage. 6: Compute(usage) runs on the record, returns the Result, and replaces the ThreadState in the Tracker with the new one as its last step. 7: Cortex prices the tokens per tier. 8: the savings go to Central metrics, an external Prometheus and Grafana system.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahk" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aho" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahg" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
