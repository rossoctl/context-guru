<text class="tl" x="756" y="454" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">usage</text>
<circle class="badge" cx="389" cy="542" r="12"/>
<text class="bn" x="389" y="546" font-size="10" text-anchor="middle">6.1</text>
<text class="tl" x="389" y="574" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">replaces</text>
<text class="t2" x="389" y="587" font-size="10" text-anchor="middle">(the ThreadState)</text>
<text class="tl" x="725" y="612" font-size="10" text-anchor="middle">tokens</text>
<text class="tl" x="725" y="623" font-size="10" text-anchor="middle">per tier</text>
<circle class="badge" cx="725" cy="584" r="10"/>
<text class="bn" x="725" y="588" font-size="12" text-anchor="middle">7</text>
<text class="tl" x="913" y="568" font-size="10" text-anchor="middle">savings</text>
<circle class="badge" cx="913" cy="584" r="10"/>
<text class="bn" x="913" y="588" font-size="12" text-anchor="middle">8</text>

<text class="t" x="24" y="676" font-size="13" font-weight="600">The sequence</text>
<circle class="badge" cx="34" cy="696" r="10"/>
<text class="bn" x="34" y="700" font-size="12" text-anchor="middle">0</text>
<text class="t" x="52" y="700" font-size="12">A new request arrives from the agent.</text>
<circle class="badge" cx="34" cy="720" r="10"/>
<text class="bn" x="34" y="724" font-size="12" text-anchor="middle">1</text>
<text class="t" x="52" y="724" font-size="12">BeginRequest(client body) opens the record. EndRequest names the thread and copies its ThreadState (1.1).</text>
<circle class="badge" cx="34" cy="744" r="10"/>
<text class="bn" x="34" y="748" font-size="12" text-anchor="middle">2</text>
<text class="t" x="52" y="748" font-size="12">Add(op): each plugin reports its context operations into the record.</text>
<circle class="badge" cx="34" cy="768" r="10"/>
<text class="bn" x="34" y="772" font-size="12" text-anchor="middle">3</text>
<text class="t" x="52" y="772" font-size="12">EndRequest(forwarded body, breakpoints, facts): the host ends the pass.</text>
<circle class="badge" cx="34" cy="792" r="10"/>
<text class="bn" x="34" y="796" font-size="12" text-anchor="middle">4</text>
<text class="t" x="52" y="796" font-size="12">The request goes upstream.</text>
<circle class="badge" cx="34" cy="816" r="10"/>
<text class="bn" x="34" y="820" font-size="12" text-anchor="middle">5</text>
<text class="t" x="52" y="820" font-size="12">The response returns, with the billed usage.</text>
<circle class="badge" cx="600" cy="696" r="10"/>
<text class="bn" x="600" y="700" font-size="12" text-anchor="middle">6</text>
<text class="t" x="618" y="700" font-size="12">Compute(usage), on the record: prices this request, then replaces the ThreadState (6.1).</text>
<circle class="badge" cx="600" cy="720" r="10"/>
<text class="bn" x="600" y="724" font-size="12" text-anchor="middle">7</text>
<text class="t" x="618" y="724" font-size="12">Cortex prices the tokens per tier that Compute returns.</text>
<circle class="badge" cx="600" cy="744" r="10"/>
<text class="bn" x="600" y="748" font-size="12" text-anchor="middle">8</text>
<text class="t" x="618" y="748" font-size="12">The savings are sent to Central metrics.</text>
</svg>
