<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 470" width="1490" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Turn 5: one new operation, three applied again</title>
<desc id="d">One row shows the forwarded prompt of turn 5, left to right: tools 20,000 tokens, system 3,000, then messages. The cache is hot and reaches the end of message 8, so everything up to there is read at 0.30 dollars per million tokens, and message 9 is written at 3.75. The client body was 71,000 tokens and the forwarded body is 52,260 tokens. Hatched blocks are what the context operators removed. Two columns on the right, with the past operations first. Operations: three operations are reported earlier and applied again by Compute: tool-prune (turn 1), expand (turn 1) and mask (turn 3); one operation is reported on this request: cmdfilter. Compute: tokens per tier. tool-prune saved 8,000 read tokens, expand caused 300 read tokens, mask saved 3,940 read tokens, cmdfilter saved 7,100 written tokens. The total line prices them: 11,640 read tokens at 0.30 dollars per million is 0.00349 dollars, plus 7,100 written tokens at 3.75 is 0.02663 dollars, a saving of 0.03012 dollars on turn 5.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
