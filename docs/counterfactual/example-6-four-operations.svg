<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" width="1300" height="660" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Turn 5: four operations, each priced at its own position</title>
<desc id="d">Two rows show the prompt of turn 5, left to right: tools 20,000 tokens, system 3,000, then messages. The cache is hot and reaches the end of message 8, so everything up to there is read at 0.30 dollars per million tokens, and message 9 is written at 3.75. The first row is the client body, 71,000 tokens, and costs 0.04890 dollars. The second row is the forwarded body, 52,260 tokens, and costs 0.01878 dollars. Hatched blocks are what the context operators removed: tool-prune removed 3 tool declarations, 8,000 tokens, read, saving 0.00240; mask removed 3,940 tokens from message 3, read, saving 0.00118; cmdfilter removed 7,100 tokens from message 9, written, saving 0.02663. expand added a 300-token tool, read, costing 0.00009. The saving on turn 5 is 0.03012 dollars.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.ghost-read{fill:url(#hr);stroke:var(--read);stroke-width:1.5;stroke-dasharray:5 3}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hr{stroke:var(--read);stroke-width:1.5}.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.axis{stroke:var(--grid);stroke-width:1}
.add{fill:var(--read);stroke:var(--ink);stroke-width:2}
.sep{stroke:var(--surface);stroke-width:2}
</style>
