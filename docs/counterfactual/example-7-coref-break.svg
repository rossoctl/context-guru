<text class="t" x="383.3" y="80" font-size="11" text-anchor="middle" font-weight="600">system</text>
<text class="t2" x="383.3" y="93" font-size="10" text-anchor="middle">3,000</text>
<text class="t" x="492.0" y="80" font-size="11" text-anchor="middle" font-weight="600">messages 0 to 4</text>
<text class="t2" x="492.0" y="93" font-size="10" text-anchor="middle">11,060</text>
<text class="t" x="732.1" y="80" font-size="11" text-anchor="middle" font-weight="600">5</text>
<text class="t2" x="732.1" y="93" font-size="10" text-anchor="middle">grep over the repo · 20,000</text>
<text class="t" x="947.8" y="80" font-size="11" text-anchor="middle" font-weight="600">6 to 11</text>
<text class="t2" x="947.8" y="93" font-size="10" text-anchor="middle">7,900</text>
