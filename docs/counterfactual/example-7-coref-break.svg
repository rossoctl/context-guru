<text class="t2" x="604.9" y="332" font-size="11" text-anchor="middle">position in the body without coref, in tokens (k = 1,000)</text>
<rect class="read" x="170" y="354" width="22" height="12" rx="2"/><text class="t" x="202" y="364" font-size="12">cache read: $0.30 per million tokens (up to B*)</text>
<rect class="write" x="560" y="354" width="22" height="12" rx="2"/><text class="t" x="592" y="364" font-size="12">cache write: $3.75 per million tokens (after B*, up to L)</text>
<rect class="ghost-read" x="170" y="380" width="22" height="12" rx="2"/><text class="t" x="202" y="390" font-size="12">tokens coref removed, at the rate they would have been billed at</text>

