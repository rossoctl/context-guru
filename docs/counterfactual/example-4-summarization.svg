<text class="t" x="1180" y="321" font-size="14" font-weight="600">cacheChange: 3,500 read → write</text>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker></defs>
