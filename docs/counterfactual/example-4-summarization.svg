<text class="t2" x="957.5" y="534" font-size="11" text-anchor="middle">17.5k</text>
<text class="t2" x="563.8" y="554" font-size="11" text-anchor="middle">position in the prompt, in tokens (k = 1,000). Because the summary is shorter, the later messages sit 9,500 tokens earlier.</text>
<rect class="read" x="170" y="576" width="22" height="12" rx="2"/><text class="t" x="202" y="586" font-size="12">cache read: $0.30 per million tokens (agent model)</text>
<rect class="write" x="560" y="576" width="22" height="12" rx="2"/><text class="t" x="592" y="586" font-size="12">cache write: $3.75 per million tokens (agent model)</text>
<rect class="cost" x="170" y="602" width="22" height="12" rx="2"/><text class="t" x="202" y="612" font-size="12">the summarizer call, priced at summarizer-model rates</text>
