# The CURRENT configuration for tenant 087fecf4e9e6404d, as read from the control-plane snapshot,
# recorded so the change is reviewable and reversible.
components:
  extract:
    min_tokens: 400
  extract_llm:
    aggressiveness: medium
    allow_on_caching_backend: true
    cold_cache:
      enabled: true
      min_tokens: 1000
    context: recent
    context_messages: 7
    economic_gate: true
    fire_on: pressure
    llm_every_n_requests: 1
    llm_max_per_request: 20
    llm_max_per_session: 80
    min_tokens: 500
    model:
      model: claude-haiku-4-5
      source: incoming
    per_output: false
    strategy: code
    trigger:
      min_request_tokens: 500
mode: sync
pipeline:
  - format
  - toon
  - dedup
  - cmdfilter
  - extract_llm
  - extract
  - cachesplit
  - textclean
