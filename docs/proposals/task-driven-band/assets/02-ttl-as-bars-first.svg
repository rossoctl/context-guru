<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 774" width="1100" height="774">
<rect width="1100" height="774" fill="#fff"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#222">Explored: TTL as bars to scale (first version)</text>
<text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#666">Mockup only. Nothing was changed in the plugin.</text>
<text x="40" y="84" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">A. Now: built-in TTL plus two automatic pings</text><rect x="40" y="94" width="1020" height="118" rx="10" fill="#232323" stroke="#555"/><line x1="192" y1="116" x2="192" y2="158" stroke="#fff" stroke-width="2"/><text x="186" y="142.0" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">now</text><rect x="201" y="124" width="163.0" height="26" rx="4" fill="#8fc79a"/><text x="282.5" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">built-in 4:35</text><rect x="366.0" y="124" width="37.0" height="26" rx="4" fill="#4ea8d2"/><text x="384.5" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping +1:05</text><rect x="405.0" y="124" width="160.0" height="26" rx="4" fill="#4ea8d2"/><text x="485.0" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping +4:30</text><text x="578.0" y="142.0" font-family="Menlo,monospace" font-size="16" fill="#4ea8d2">10:10</text><text x="60" y="200" font-family="Menlo,monospace" font-size="14" fill="#bbb" xml:space="preserve">in the band: ███████████████████████████████ 10:10</text><text x="40" y="234" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">B. After the first automatic ping: the spent bar is gone, nothing else changes</text><rect x="40" y="244" width="1020" height="118" rx="10" fill="#232323" stroke="#555"/><line x1="192" y1="266" x2="192" y2="308" stroke="#fff" stroke-width="2"/><text x="186" y="292.0" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">now</text><rect x="201" y="274" width="178.0" height="26" rx="4" fill="#4ea8d2"/><text x="290.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping 5:00</text><rect x="381.0" y="274" width="160.0" height="26" rx="4" fill="#4ea8d2"/><text x="461.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping +4:30</text><text x="554.0" y="292.0" font-family="Menlo,monospace" font-size="16" fill="#4ea8d2">9:30</text><text x="60" y="350" font-family="Menlo,monospace" font-size="14" fill="#bbb" xml:space="preserve">in the band: █████████████████████████████ 9:30</text><text x="40" y="384" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">C. You press &quot;Ping now&quot;: a blue bar is added on the right (assumes +5:00)</text><rect x="40" y="394" width="1020" height="118" rx="10" fill="#232323" stroke="#555"/><line x1="192" y1="416" x2="192" y2="458" stroke="#fff" stroke-width="2"/><text x="186" y="442.0" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">now</text><rect x="201" y="424" width="163.0" height="26" rx="4" fill="#8fc79a"/><text x="282.5" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">built-in 4:35</text><rect x="366.0" y="424" width="37.0" height="26" rx="4" fill="#4ea8d2"/><text x="384.5" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping</text><rect x="405.0" y="424" width="160.0" height="26" rx="4" fill="#4ea8d2"/><text x="485.0" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">ping</text><rect x="567.0" y="424" width="178.0" height="26" rx="4" fill="#5c9dff"/><text x="656.0" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">manual +5:00</text><text x="758.0" y="442.0" font-family="Menlo,monospace" font-size="16" fill="#e0b050">15:10 ?</text><text x="60" y="500" font-family="Menlo,monospace" font-size="14" fill="#bbb" xml:space="preserve">in the band: ███████████████████████████████▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ 15:10 ?</text><text x="40" y="534" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">D. Cold: nothing left to burn</text><rect x="40" y="544" width="1020" height="118" rx="10" fill="#232323" stroke="#555"/><line x1="192" y1="566" x2="192" y2="608" stroke="#fff" stroke-width="2"/><text x="186" y="592.0" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ddd">now</text><rect x="200" y="574" width="384.0" height="26" rx="4" fill="none" stroke="#555" stroke-dasharray="3 5"/><text x="600" y="592.0" font-family="Menlo,monospace" font-size="16" fill="#8a8a8a">cold for 7:06</text><text x="60" y="650" font-family="Menlo,monospace" font-size="14" fill="#bbb" xml:space="preserve">in the band: ······························ cold 7:06  (no Ping)</text><g font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333">
<text x="40" y="684" font-weight="700" font-size="15">Legend</text>
<rect x="40" y="696" width="26" height="14" rx="3" fill="#8fc79a"/><text x="74" y="708">built-in TTL</text>
<rect x="220" y="696" width="26" height="14" rx="3" fill="#4ea8d2"/><text x="254" y="708">automatic ping</text>
<rect x="420" y="696" width="26" height="14" rx="3" fill="#5c9dff"/><text x="454" y="708">manual ping (one bar per click)</text>
<text x="40" y="740" fill="#555">Bar length = time (1 character = 20 s in the text form). Superseded by 04-band-proposed.svg, which adds dashed (planned) and elapsed time.</text>
</g></svg>
