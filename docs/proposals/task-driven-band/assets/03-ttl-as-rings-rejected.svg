<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 946" width="1100" height="946">
<rect width="1100" height="946" fill="#fff"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#222">Explored and rejected: TTL as rings</text>
<text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#666">Mockup only. Nothing was changed in the plugin.</text>
<text x="40" y="82" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">A. Now: the built-in TTL is running, two automatic pings are planned</text><text x="40" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666">ring = one 5-minute TTL window. A ping lands before the previous ring empties and starts the next ring.</text><rect x="40" y="108" width="1020" height="146" rx="10" fill="#232323" stroke="#555"/><circle cx="110" cy="162" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><circle cx="110" cy="162" r="34" fill="none" stroke="#8fc79a" stroke-width="9" stroke-dasharray="195.8 213.6" transform="rotate(-90 110 162)"/><text x="110" y="167" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8fc79a">4:35</text><text x="110" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">built-in TTL</text><text x="110" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">entry deadline</text><line x1="152" y1="162" x2="240" y2="162" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="240,158 248,162 240,166" fill="#777"/><text x="200.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">auto ping</text><circle cx="290" cy="162" r="34" fill="none" stroke="#4ea8d2" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/><text x="290" y="167" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">↻</text><text x="290" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 1</text><text x="290" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">in 0:40 (planned)</text><line x1="332" y1="162" x2="420" y2="162" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="420,158 428,162 420,166" fill="#777"/><text x="380.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">+4:30</text><circle cx="470" cy="162" r="34" fill="none" stroke="#4ea8d2" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/><text x="470" y="167" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">↻</text><text x="470" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 2</text><text x="470" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">in 5:10 (planned)</text><line x1="512" y1="162" x2="600" y2="162" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="600,158 608,162 600,166" fill="#777"/><text x="560.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">+5:00</text><rect x="620" y="146" width="170" height="32" rx="16" fill="none" stroke="#4ea8d2" stroke-width="1.5"/><text x="705" y="167" text-anchor="middle" font-family="Menlo,monospace" font-size="14" fill="#4ea8d2">cold in ≈ 10:10</text><text x="40" y="272" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">B. Automatic ping 1 was sent</text><text x="40" y="290" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666">The built-in ring is spent. Ping 1 started a new ring and is now the one draining.</text><rect x="40" y="298" width="1020" height="146" rx="10" fill="#232323" stroke="#555"/><circle cx="110" cy="352" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><text x="110" y="357" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8a8a8a">✓</text><text x="110" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">built-in TTL</text><text x="110" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">spent</text><line x1="152" y1="352" x2="240" y2="352" stroke="#777" stroke-width="1.5" /><polygon points="240,348 248,352 240,356" fill="#777"/><circle cx="290" cy="352" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><circle cx="290" cy="352" r="34" fill="none" stroke="#4ea8d2" stroke-width="9" stroke-dasharray="212.2 213.6" transform="rotate(-90 290 352)"/><text x="290" y="357" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">4:58</text><text x="290" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 1</text><text x="290" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">sent ↻</text><line x1="332" y1="352" x2="420" y2="352" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="420,348 428,352 420,356" fill="#777"/><text x="380.0" y="344" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">+4:30</text><circle cx="470" cy="352" r="34" fill="none" stroke="#4ea8d2" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/><text x="470" y="357" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">↻</text><text x="470" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 2</text><text x="470" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">planned</text><line x1="512" y1="352" x2="600" y2="352" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="600,348 608,352 600,356" fill="#777"/><text x="560.0" y="344" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">+5:00</text><rect x="620" y="336" width="170" height="32" rx="16" fill="none" stroke="#4ea8d2" stroke-width="1.5"/><text x="705" y="357" text-anchor="middle" font-family="Menlo,monospace" font-size="14" fill="#4ea8d2">cold in ≈ 9:30</text><text x="40" y="462" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">C. You press &quot;Ping now&quot;: a manual ring is added</text><text x="40" y="480" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666">Each click adds one more ring. The ring is full because a ping restarts the 5-minute timer.</text><rect x="40" y="488" width="1020" height="146" rx="10" fill="#232323" stroke="#555"/><circle cx="110" cy="542" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><text x="110" y="547" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8a8a8a">✓</text><text x="110" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">built-in TTL</text><text x="110" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">replaced</text><line x1="152" y1="542" x2="240" y2="542" stroke="#777" stroke-width="1.5" /><polygon points="240,538 248,542 240,546" fill="#777"/><circle cx="290" cy="542" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><circle cx="290" cy="542" r="34" fill="none" stroke="#5c9dff" stroke-width="9" stroke-dasharray="213.6 213.6" transform="rotate(-90 290 542)"/><text x="290" y="547" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#5c9dff">5:00</text><text x="290" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">manual ping</text><text x="290" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">you pressed it</text><line x1="332" y1="542" x2="420" y2="542" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="420,538 428,542 420,546" fill="#777"/><text x="380.0" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a">auto ping</text><circle cx="470" cy="542" r="34" fill="none" stroke="#4ea8d2" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/><text x="470" y="547" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">↻</text><text x="470" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 1</text><text x="470" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">planned</text><line x1="512" y1="542" x2="600" y2="542" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="600,538 608,542 600,546" fill="#777"/><circle cx="650" cy="542" r="34" fill="none" stroke="#4ea8d2" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/><text x="650" y="547" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#4ea8d2">↻</text><text x="650" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 2</text><text x="650" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">planned</text><line x1="692" y1="542" x2="802" y2="542" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="802,538 810,542 802,546" fill="#777"/><rect x="820" y="526" width="170" height="32" rx="16" fill="none" stroke="#e0b050" stroke-width="1.5"/><text x="905" y="547" text-anchor="middle" font-family="Menlo,monospace" font-size="14" fill="#e0b050">cold in ≈ ?</text><text x="40" y="652" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#222">D. Cold</text><text x="40" y="670" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666">A cold cache cannot be refreshed by a ping. The rings stop.</text><rect x="40" y="678" width="1020" height="146" rx="10" fill="#232323" stroke="#555"/><circle cx="110" cy="732" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><text x="110" y="737" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8a8a8a">○</text><text x="110" y="792" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">built-in TTL</text><text x="110" y="810" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">expired</text><line x1="152" y1="732" x2="240" y2="732" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="240,728 248,732 240,736" fill="#777"/><circle cx="290" cy="732" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><text x="290" y="737" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8a8a8a">✕</text><text x="290" y="792" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 1</text><text x="290" y="810" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">stopped</text><circle cx="470" cy="732" r="34" fill="none" stroke="#3a3a3a" stroke-width="9"/><text x="470" y="737" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#8a8a8a">✕</text><text x="470" y="792" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ddd">auto ping 2</text><text x="470" y="810" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a">stopped</text><rect x="620" y="716" width="170" height="32" rx="16" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="705" y="737" text-anchor="middle" font-family="Menlo,monospace" font-size="14" fill="#8a8a8a">cold for 7:06</text><g font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333">
<text x="40" y="856" font-weight="700" font-size="15">Legend</text>
<circle cx="52" cy="878" r="9" fill="none" stroke="#8fc79a" stroke-width="5"/><text x="70" y="883">built-in TTL, draining</text>
<circle cx="260" cy="878" r="9" fill="none" stroke="#4ea8d2" stroke-width="2" stroke-dasharray="3 3"/><text x="278" y="883">planned automatic ping</text>
<circle cx="470" cy="878" r="9" fill="none" stroke="#4ea8d2" stroke-width="5"/><text x="488" y="883">automatic ping sent</text>
<circle cx="660" cy="878" r="9" fill="none" stroke="#5c9dff" stroke-width="5"/><text x="678" y="883">manual ping (one per click)</text>
<circle cx="880" cy="878" r="9" fill="none" stroke="#555" stroke-width="5"/><text x="898" y="883">spent or stopped</text>
<text x="40" y="918" fill="#555">Rejected: rings are not drawn to scale, and they do not fit a text band. Kept as a record of the idea.</text>
</g></svg>
