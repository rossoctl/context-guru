<rect class="write" x="170" y="486" width="22" height="12" rx="2"/><text class="t" x="202" y="496" font-size="12">cache write: $3.75 per million tokens</text>
<rect class="ghost-write" x="170" y="512" width="22" height="12" rx="2"/><rect class="ghost-read" x="196" y="512" width="22" height="12" rx="2"/><text class="t" x="228" y="522" font-size="12">tokens the change removed, drawn at the rate they would have been billed at (orange: written, blue: read)</text>
