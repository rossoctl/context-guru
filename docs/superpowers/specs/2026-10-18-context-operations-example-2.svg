<line class="axis" x1="531.9" y1="404" x2="531.9" y2="410"/>
<text class="t2" x="531.9" y="424" font-size="11" text-anchor="middle">20k</text>
<line class="axis" x1="712.9" y1="404" x2="712.9" y2="410"/>
<text class="t2" x="712.9" y="424" font-size="11" text-anchor="middle">30k</text>
<line class="axis" x1="893.8" y1="404" x2="893.8" y2="410"/>
<text class="t2" x="893.8" y="424" font-size="11" text-anchor="middle">40k</text>
<text class="t2" x="550.0" y="442" font-size="11" text-anchor="middle">position in the prompt, in tokens (k = 1,000). Because message 9 was shortened, the later messages sit 7,000 tokens earlier.</text>
