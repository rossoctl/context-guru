<text class="t" x="794.3" y="284" font-size="11" text-anchor="middle" font-weight="600">7,000 saved</text>
<text class="t2" x="875.7" y="315" font-size="10" text-anchor="middle">+2k</text>
<text class="t" x="945" y="279" font-size="15" font-weight="600">$0.00210</text>
<text class="t2" x="945" y="295" font-size="11">7,000 × $0.30</text>
<text class="t" x="24" y="346" font-size="14" font-weight="600">Request 3</text>
<text class="t2" x="24" y="360" font-size="11">20 min after request 2</text>
<text class="t2" x="24" y="373" font-size="11">cold (expired)</text>
