<rect class="ghost-write" x="731.0" y="190" width="126.7" height="40" rx="3"/>
<rect class="pill" x="756.3" y="201" width="76" height="18" rx="9"/>
<text class="t" x="794.3" y="214" font-size="11" text-anchor="middle" font-weight="600">7,000 saved</text>
<text class="t" x="945" y="209" font-size="15" font-weight="600">$0.02625</text>
<text class="t2" x="945" y="225" font-size="11">7,000 × $3.75</text>
<text class="t" x="24" y="276" font-size="14" font-weight="600">Request 2</text>
<text class="t2" x="24" y="290" font-size="11">1 min after request 1</text>
<text class="t2" x="24" y="303" font-size="11">hot</text>
