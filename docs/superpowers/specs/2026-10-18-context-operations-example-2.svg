<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 550" width="1110" height="550" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The 7,000 tokens saved by one change, in three requests</title>
<desc id="d">Each row is a request. The horizontal axis is the prompt, in tokens, split by message. The 7,000 tokens that the change removed from message 9 are drawn as a hatched block in every request, at the same place. The block is blue where those tokens would have been read from the cache, and orange where they would have been written. Request 1 saves 0.02625 dollars, request 2 saves 0.00210 dollars, request 3 saves 0.02625 dollars, 0.05460 in total.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.ghost-read{fill:url(#hr);stroke:var(--read);stroke-width:1.5;stroke-dasharray:5 3}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hr{stroke:var(--read);stroke-width:1.5}.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.axis{stroke:var(--grid);stroke-width:1}
.pill{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:2}
</style>
<defs>
<pattern id="hr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hr" x1="0" y1="0" x2="0" y2="8"/></pattern>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hw" x1="0" y1="0" x2="0" y2="8"/></pattern>
</defs>
<rect class="bg" width="1110" height="550"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">One change, three requests: the same 7,000 tokens are saved every time</text>
<text class="t2" x="24" y="50" font-size="12">Each row is a request. Left to right is the prompt, message by message; widths are in tokens. The hatched block is what the change removed.</text>
<text class="t" x="441.4" y="84" font-size="12" text-anchor="middle" font-weight="600">messages 0 to 8</text>
<text class="t2" x="441.4" y="98" font-size="11" text-anchor="middle">30,000 tokens, unchanged</text>
<text class="t" x="794.3" y="72" font-size="12" text-anchor="middle" font-weight="600">message 9</text>
<text class="t2" x="794.3" y="86" font-size="11" text-anchor="middle">8,000 → 1,000 tokens</text>
<path d="M712.9 108 V101 H857.6 V108" fill="none" stroke="var(--ink2)" stroke-width="1"/>
<text class="t" x="869.6" y="84" font-size="12" font-weight="600">later turns</text>
<text class="t2" x="869.6" y="98" font-size="11">new messages</text>
<line class="guide" x1="731.0" y1="110" x2="731.0" y2="404"/>
<line class="guide" x1="857.6" y1="110" x2="857.6" y2="404"/>
<text class="t" x="24" y="136" font-size="14" font-weight="600">Request 0</text>
<text class="t2" x="24" y="150" font-size="11">before the change</text>
<text class="t2" x="24" y="163" font-size="11">messages 0 to 8</text>
<rect class="write" x="170.0" y="120" width="542.9" height="40" rx="3"/>
<line class="sep" x1="215.2" y1="120" x2="215.2" y2="160"/>
<line class="sep" x1="291.2" y1="120" x2="291.2" y2="160"/>
<line class="sep" x1="323.8" y1="120" x2="323.8" y2="160"/>
