<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 690" width="1370" height="690" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Summarization: the call costs money first, then each request saves 9,500 tokens</title>
<desc id="d">Each row is a request, or the summarizer call. The horizontal axis is the prompt, in tokens, split by message. Before the summary, messages 0 to 2 are 10,000 tokens. The summarizer call reads those 10,000 tokens and costs 0.0125 dollars. In requests A, B and C the summary is 500 tokens, and the 9,500 tokens it removed are drawn as a hatched block at the same place in every request. Request A is hot, but it is the first request with the summary, so it writes the 500-token summary to the cache instead of reading 10,000 tokens, and saves 0.00113 dollars. Request B is hot and saves 0.00285 dollars, at the cache read rate. Request C is cold, 15 minutes after B, and saves 0.03563 dollars at the cache write rate. The balance after three requests is a profit of 0.02711 dollars. Request A is drawn in a frame with two bars: the summarizer call (a spend operation) and the prompt sent (a rewrite and a cacheBreak). A column lists the operations: the rewrite is reported on A, B and C.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834;--cost:#8a8984}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926;--cost:#8f8e88}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.cost{fill:var(--cost);stroke:var(--surface);stroke-width:2}
.ghost-read{fill:url(#hr);stroke:var(--read);stroke-width:1.5;stroke-dasharray:5 3}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hr{stroke:var(--read);stroke-width:1.5}.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.axis{stroke:var(--grid);stroke-width:1}
.pill{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:2}
</style>
<defs>
<pattern id="hr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hr" x1="0" y1="0" x2="0" y2="8"/></pattern>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hw" x1="0" y1="0" x2="0" y2="8"/></pattern>
<linearGradient id="fg"><stop offset="0.55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="fade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fg)"/></mask>
</defs>
<rect class="bg" width="1370" height="690"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">Summarization: the call costs money first, then each request saves 9,500 tokens</text>
<text class="t2" x="24" y="50" font-size="12">Each row is a request, or the summarizer call. Left to right is the prompt, message by message; widths are in tokens. The hatched block is what the summary removed.</text>
<text class="t" x="470.0" y="84" font-size="12" text-anchor="middle" font-weight="600">messages 0 to 2</text>
<text class="t2" x="470.0" y="98" font-size="11" text-anchor="middle">10,000 → 500 tokens (one summary)</text>
<path d="M170 108 V101 H770.0 V108" fill="none" stroke="var(--ink2)" stroke-width="1"/>
<text class="t" x="782.0" y="84" font-size="12" font-weight="600">later turns</text>
<text class="t2" x="782.0" y="98" font-size="11">one new message each</text>
<text class="t2" x="1180" y="114" font-size="11">saving · balance</text>
<text class="t" x="1075" y="84" font-size="12" font-weight="600">operations</text>
<text class="t2" x="1075" y="98" font-size="11">reported</text>
<line class="guide" x1="200.0" y1="110" x2="200.0" y2="514"/>
<line class="guide" x1="770.0" y1="110" x2="770.0" y2="514"/>
<text class="t" x="24" y="136" font-size="14" font-weight="600">Before</text>
<text class="t2" x="24" y="150" font-size="11">the summary</text>
<text class="t2" x="24" y="163" font-size="11">already cached</text>
<rect class="write" x="170.0" y="120" width="600.0" height="40" rx="3"/>
<line class="sep" x1="350.0" y1="120" x2="350.0" y2="160"/>
<line class="sep" x1="470.0" y1="120" x2="470.0" y2="160"/>
