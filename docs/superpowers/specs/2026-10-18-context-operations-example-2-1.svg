<rect class="read" x="170.0" y="376" width="30.0" height="40" rx="3"/>
<rect class="ghost-read" x="200.0" y="376" width="570.0" height="40" rx="3"/>
<rect class="read" x="770.0" y="376" width="120.0" height="40" rx="3"/>
<rect class="write" x="890.0" y="376" width="90.0" height="40" rx="3"/>
<text class="t2" x="935.0" y="429" font-size="10" text-anchor="middle">+1.5k, msg 4</text>
<rect class="pill" x="447.0" y="387" width="76" height="18" rx="9"/>
<text class="t" x="485.0" y="400" font-size="11" text-anchor="middle" font-weight="600">9,500 saved</text>
<text class="t2" x="170" y="429" font-size="10">summary</text>
<text class="t" x="1075" y="389" font-size="12" font-weight="600">rewrite</text>
<text class="t" x="1180" y="395" font-size="15" font-weight="600">+$0.00285</text>
<text class="t2" x="1180" y="411" font-size="11">9,500 × $0.30</text>
<text class="t2" x="1180" y="425" font-size="11">balance −$0.00852</text>
<text class="t" x="24" y="462" font-size="14" font-weight="600">Request C</text>
<text class="t2" x="24" y="476" font-size="11">15 min after B</text>
<text class="t2" x="24" y="489" font-size="11">cold (expired)</text>
<rect class="write" x="170.0" y="446" width="30.0" height="40" rx="3"/>
<rect class="ghost-write" x="200.0" y="446" width="570.0" height="40" rx="3"/>
<rect class="write" x="770.0" y="446" width="120.0" height="40" rx="3"/>
<rect class="write" x="890.0" y="446" width="90.0" height="40" rx="3"/>
<rect class="write" x="980.0" y="446" width="60.0" height="40" rx="3"/>
<text class="t2" x="1010.0" y="499" font-size="10" text-anchor="middle">+1k, msg 5</text>
<rect class="pill" x="447.0" y="457" width="76" height="18" rx="9"/>
<text class="t" x="485.0" y="470" font-size="11" text-anchor="middle" font-weight="600">9,500 saved</text>
<text class="t2" x="170" y="499" font-size="10">summary</text>
<text class="t" x="1075" y="459" font-size="12" font-weight="600">rewrite</text>
<text class="t" x="1180" y="465" font-size="15" font-weight="600">+$0.03563</text>
<text class="t2" x="1180" y="481" font-size="11">9,500 × $3.75</text>
