<line class="sep" x1="350.0" y1="212" x2="350.0" y2="252"/>
<line class="sep" x1="470.0" y1="212" x2="470.0" y2="252"/>
<rect class="pill" x="363.0" y="223" width="214" height="18" rx="9"/>
<text class="t" x="470.0" y="236" font-size="11" text-anchor="middle" font-weight="600">reads 10,000, writes a 500 summary</text>
<text class="t" x="1075" y="225" font-size="12" font-weight="600">spend</text>
<text class="t" x="1180" y="231" font-size="15" font-weight="600">−$0.01250</text>
<text class="t2" x="1180" y="247" font-size="11">10,000 × $1.00 + 500 × $5.00</text>
<text class="t2" x="1180" y="261" font-size="11">balance −$0.01250</text>
<rect class="write" x="170.0" y="282" width="30.0" height="40" rx="3"/>
<rect class="ghost-read" x="200.0" y="282" width="570.0" height="40" rx="3"/>
<rect class="write" x="770.0" y="282" width="120.0" height="40" rx="3"/>
<text class="t2" x="830.0" y="335" font-size="10" text-anchor="middle">+2k, msg 3</text>
<rect class="pill" x="447.0" y="293" width="76" height="18" rx="9"/>
<text class="t" x="485.0" y="306" font-size="11" text-anchor="middle" font-weight="600">9,500 saved</text>
<text class="t2" x="170" y="335" font-size="10">summary</text>
<text class="t" x="1075" y="295" font-size="12" font-weight="600">rewrite</text>
<text class="t" x="1075" y="308" font-size="12" font-weight="600">cacheBreak</text>
<text class="t" x="1180" y="301" font-size="15" font-weight="600">+$0.00113</text>
<text class="t2" x="1180" y="317" font-size="11">10,000 × $0.30 − 500 × $3.75</text>
<text class="t2" x="1180" y="331" font-size="11">balance −$0.01137</text>
