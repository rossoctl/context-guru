<line class="axis" x1="170.0" y1="514" x2="170.0" y2="520"/>
<text class="t2" x="170.0" y="534" font-size="11" text-anchor="middle">0k</text>
<line class="axis" x1="200.0" y1="514" x2="200.0" y2="520"/>
<text class="t2" x="204.0" y="534" font-size="11" text-anchor="start">0.5k</text>
<line class="axis" x1="470.0" y1="514" x2="470.0" y2="520"/>
<text class="t2" x="470.0" y="534" font-size="11" text-anchor="middle">5k</text>
<line class="axis" x1="770.0" y1="514" x2="770.0" y2="520"/>
<text class="t2" x="770.0" y="534" font-size="11" text-anchor="middle">10k</text>
<line class="axis" x1="1040.0" y1="514" x2="1040.0" y2="520"/>
<text class="t2" x="1040.0" y="534" font-size="11" text-anchor="middle">14.5k</text>
<text class="t2" x="605.0" y="554" font-size="11" text-anchor="middle">position in the prompt, in tokens (k = 1,000). Because the summary is shorter, the later messages sit 9,500 tokens earlier.</text>
<rect class="read" x="170" y="576" width="22" height="12" rx="2"/><text class="t" x="202" y="586" font-size="12">cache read: $0.30 per million tokens (agent model)</text>
<rect class="write" x="560" y="576" width="22" height="12" rx="2"/><text class="t" x="592" y="586" font-size="12">cache write: $3.75 per million tokens (agent model)</text>
<rect class="cost" x="170" y="602" width="22" height="12" rx="2"/><text class="t" x="202" y="612" font-size="12">the summarizer call, priced at small-model rates</text>
<rect class="ghost-write" x="560" y="602" width="22" height="12" rx="2"/><rect class="ghost-read" x="586" y="602" width="22" height="12" rx="2"/><text class="t" x="618" y="612" font-size="12">tokens the summary removed, at the rate they would have been billed at</text>
<text class="t2" x="170" y="638" font-size="11">Request A is the first request with the summary, so it writes the summary to the cache (orange) instead of reading the old messages.</text>
</svg>
