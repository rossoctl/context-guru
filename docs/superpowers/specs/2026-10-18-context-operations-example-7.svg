<rect class="read" x="170" y="464" width="22" height="12" rx="2"/><text class="t" x="202" y="474" font-size="12">cache read: $0.30 per million tokens (up to B*)</text>
<rect class="write" x="560" y="464" width="22" height="12" rx="2"/><text class="t" x="592" y="474" font-size="12">cache write: $3.75 per million tokens (after B*, up to L)</text>
