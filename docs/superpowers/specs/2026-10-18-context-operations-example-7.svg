<line class="guide" x1="1008.9" y1="108" x2="1008.9" y2="402"/>
<line class="guide" x1="1039.8" y1="108" x2="1039.8" y2="402"/>
<text class="t2" x="406.5" y="120" font-size="10" text-anchor="middle">breakpoint 1 (end of system)</text>
<text class="t2" x="1002.9" y="120" font-size="10" text-anchor="end">B* = end of message 11</text>
