<line class="axis" x1="788.4" y1="402" x2="788.4" y2="408"/>
<text class="t2" x="788.4" y="422" font-size="11" text-anchor="middle">40k</text>
<line class="axis" x1="1039.8" y1="402" x2="1039.8" y2="408"/>
