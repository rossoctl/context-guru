<text class="t" x="732.5" y="296" font-size="11" text-anchor="middle" font-weight="600">coref</text>
<text class="t2" x="732.5" y="309" font-size="10" text-anchor="middle">−19,950 · would have been read</text>
<path d="M406.5 320 V326 H577.5 V320" fill="none" stroke="var(--write)" stroke-width="1.5"/>
<path d="M886.7 320 V326 H1008.9 V320" fill="none" stroke="var(--write)" stroke-width="1.5"/>
<text class="t" x="479.2" y="342" font-size="11" font-weight="600">cache break: written instead of read</text>
<text class="t2" x="479.2" y="355" font-size="10">messages 0 to 4 and 6 to 11, plus the 50-token marker: 19,010</text>
<text class="t" x="1075" y="234" font-size="11" fill="none"></text>
<text class="t2" x="1075" y="234" font-size="11">operation</text><text class="t2" x="1160" y="234" font-size="11">saving</text>
<text class="t" x="1075" y="255" font-size="12" font-weight="600">coref</text>
<text class="t" x="1160" y="255" font-size="12">+$0.00599</text>
<text class="t2" x="1075" y="267" font-size="10">19,950 × $0.30 · message 5, before B*: read</text>
<text class="t" x="1075" y="285" font-size="12" font-weight="600">cacheBreak</text>
<text class="t" x="1160" y="285" font-size="12">−$0.06558</text>
<text class="t2" x="1075" y="297" font-size="10">19,010 × ($3.75 − $0.30) · written instead of read</text>
<text class="t2" x="1075" y="324" font-size="11">bill $0.08338:</text>
<text class="t2" x="1075" y="338" font-size="11">15,300 × $0.30 + 21,010 × $3.75</text>
