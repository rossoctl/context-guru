<text class="t2" x="1075" y="167" font-size="11">54,260 × $0.30 + 2,000 × $3.75</text>
<text class="t" x="24" y="258" font-size="14" font-weight="600">Forwarded body</text>
<text class="t2" x="24" y="272" font-size="11">with coref</text>
<text class="t2" x="24" y="285" font-size="11">36,310 tokens</text>
<rect class="read" x="170.0" y="242" width="236.5" height="40" rx="3"/>
<rect class="write" x="406.5" y="242" width="171.8" height="40" rx="3"/>
<rect class="ghost-read" x="578.3" y="242" width="308.4" height="40" rx="3"/>
<rect class="write" x="886.7" y="242" width="153.1" height="40" rx="3"/>
<line class="sep" x1="360.2" y1="242" x2="360.2" y2="282"/>
<line class="sep" x1="406.5" y1="242" x2="406.5" y2="282"/>
