<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Turn 7: coref saves $0.00599 and breaks the cache for $0.06558</title>
<desc id="d">Two rows show the prompt of turn 7, left to right: tools and system 15,300 tokens, messages 0 to 4 11,060, message 5 20,000, messages 6 to 11 7,900, new messages 2,000. Without coref the cache is read up to the end of message 11, 54,260 tokens, and 2,000 are written: 0.02378 dollars. With coref, message 5 becomes 50 tokens. The forwarded body differs from turn 6 at message 5, which is after the last breakpoint before it, the end of system. The provider reads only 15,300 tokens and writes 21,010: 0.08338 dollars. The 19,950 removed tokens save 0.00599 dollars. The 19,010 tokens written instead of read cost 0.06558 dollars. The net on turn 7 is minus 0.05960 dollars.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#d9d8d3;--read:#2a78d6;--write:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--read:#3987e5;--write:#d95926}}
.bg{fill:var(--surface)}
.read{fill:var(--read);stroke:var(--surface);stroke-width:2}
.write{fill:var(--write);stroke:var(--surface);stroke-width:2}
.ghost-read{fill:url(#hr);stroke:var(--read);stroke-width:1.5;stroke-dasharray:5 3}
.ghost-write{fill:url(#hw);stroke:var(--write);stroke-width:1.5;stroke-dasharray:5 3}
.hr{stroke:var(--read);stroke-width:1.5}.hw{stroke:var(--write);stroke-width:1.5}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}
.guide{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.axis{stroke:var(--grid);stroke-width:1}
.add{fill:var(--read);stroke:var(--ink);stroke-width:2}
.sep{stroke:var(--surface);stroke-width:2}
</style>
<defs>
<pattern id="hr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hr" x1="0" y1="0" x2="0" y2="8"/></pattern>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hw" x1="0" y1="0" x2="0" y2="8"/></pattern>
</defs>
<rect class="bg" width="1300" height="560"/>
<text class="t" x="24" y="30" font-size="17" font-weight="600">Turn 7: coref saves $0.00599 and breaks the cache for $0.06558</text>
<text class="t2" x="24" y="50" font-size="12">Each row is the prompt, left to right; widths are in tokens. The hatched block is what coref removed.</text>
<text class="t" x="265.1" y="80" font-size="11" text-anchor="middle" font-weight="600">tools</text>
<text class="t2" x="265.1" y="93" font-size="10" text-anchor="middle">12,000 + expand 300</text>
<text class="t" x="383.3" y="80" font-size="11" text-anchor="middle" font-weight="600">system</text>
<text class="t2" x="383.3" y="93" font-size="10" text-anchor="middle">3,000</text>
<text class="t" x="492.0" y="80" font-size="11" text-anchor="middle" font-weight="600">messages 0 to 4</text>
<text class="t2" x="492.0" y="93" font-size="10" text-anchor="middle">11,060</text>
<text class="t" x="732.1" y="80" font-size="11" text-anchor="middle" font-weight="600">5</text>
<text class="t2" x="732.1" y="93" font-size="10" text-anchor="middle">grep over the repo · 20,000</text>
<text class="t" x="947.8" y="80" font-size="11" text-anchor="middle" font-weight="600">6 to 11</text>
<text class="t2" x="947.8" y="93" font-size="10" text-anchor="middle">7,900</text>
<text class="t" x="1024.3" y="80" font-size="11" text-anchor="middle" font-weight="600">new</text>
<text class="t2" x="1024.3" y="93" font-size="10" text-anchor="middle">2,000</text>
