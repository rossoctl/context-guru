<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <text x="550" y="26" text-anchor="middle" font-size="17" font-weight="bold">Accountant hook: from one request to metrics and the ledger</text>

  <!-- Proxy box -->
  <rect x="20" y="50" width="1060" height="560" rx="10" fill="#f8fafc" stroke="#7a8ca5" stroke-dasharray="6,4"/>
  <text x="32" y="70" font-size="12" fill="#555">Proxy (cortex or context-guru)</text>

  <!-- Proxy request handler -->
  <rect x="40" y="95" width="190" height="90" rx="6" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
  <text x="135" y="125" text-anchor="middle" font-weight="bold">Request handler</text>
  <text x="135" y="146" text-anchor="middle" font-size="12">sends request to LLM,</text>
  <text x="135" y="162" text-anchor="middle" font-size="12">gets response + usage</text>

  <!-- Accountant -->
  <rect x="300" y="80" width="300" height="280" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="450" y="102" text-anchor="middle" font-weight="bold">accountant (standard library only)</text>
  <rect x="320" y="115" width="260" height="55" rx="5" fill="#fff" stroke="#333"/>
  <text x="450" y="138" text-anchor="middle">Compute(Usage) -> Result</text>
  <text x="450" y="156" text-anchor="middle" font-size="11" fill="#555">pure, no side effects</text>
  <rect x="320" y="190" width="260" height="55" rx="5" fill="#fff" stroke="#333"/>
  <text x="450" y="213" text-anchor="middle">Result.Record(meta) -> Record</text>
  <text x="450" y="231" text-anchor="middle" font-size="11" fill="#555">pure; adds IDs, model, totals</text>
  <rect x="320" y="265" width="260" height="75" rx="5" fill="#fff" stroke="#333" stroke-dasharray="4,3"/>
  <text x="450" y="288" text-anchor="middle">interface Sink { Observe(Record) }</text>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#555">one method; the accountant only</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#555">declares it, never calls it</text>

  <!-- Arrows within -->
  <path d="M230,125 L320,142" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="275" y="118" text-anchor="middle" font-size="12">1. Usage</text>
  <path d="M450,170 L450,190" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="458" y="183" font-size="11">Result</text>
  <path d="M320,217 L270,217 L270,170 L230,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="262" y="236" text-anchor="end" font-size="12">2. Record</text>

  <!-- Fanout -->
  <rect x="40" y="290" width="190" height="60" rx="6" fill="#e3f0fb" stroke="#1d6fb8" stroke-width="1.5"/>
  <text x="135" y="315" text-anchor="middle" font-weight="bold">Multi(sinks...)</text>
  <text x="135" y="333" text-anchor="middle" font-size="12">3. proxy calls Observe</text>
  <path d="M135,185 L135,290" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M320,300 L230,320" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="275" y="296" text-anchor="middle" font-size="11" fill="#555">implements</text>

  <!-- Shared metrics module -->
  <rect x="680" y="95" width="370" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="865" y="118" text-anchor="middle" font-weight="bold">accountant/metrics (separate module, defined once)</text>
  <text x="865" y="142" text-anchor="middle" font-size="12">metric names, units and labels</text>
  <text x="865" y="160" text-anchor="middle" font-size="12">tokens by tier  +  money (tokens x Rates)</text>
  <text x="865" y="178" text-anchor="middle" font-size="12">saved and added counters</text>
  <text x="865" y="196" text-anchor="middle" font-size="12">failed-check counter</text>
  <text x="865" y="220" text-anchor="middle" font-size="12">options: user label on/off, prefix</text>
  <text x="865" y="238" text-anchor="middle" font-size="12">input: Meter + Rates from the proxy</text>
  <text x="865" y="270" text-anchor="middle" font-size="11" fill="#2e7d32">uses the OTel API only</text>

  <!-- Ledger sink -->
  <rect x="680" y="330" width="370" height="90" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="865" y="358" text-anchor="middle" font-weight="bold">Ledger sink (proxy's own)</text>
  <text x="865" y="378" text-anchor="middle" font-size="12">stores the full Record with request,</text>
  <text x="865" y="394" text-anchor="middle" font-size="12">thread, session and user IDs</text>

  <!-- Extra proxy sink -->
  <rect x="680" y="450" width="370" height="70" rx="8" fill="#fff" stroke="#333" stroke-dasharray="4,3"/>
  <text x="865" y="478" text-anchor="middle" font-weight="bold">Proxy-only sink or metric (optional)</text>
  <text x="865" y="498" text-anchor="middle" font-size="12">own prefix: cortex_ or contextguru_</text>

  <!-- Multi to sinks -->
  <path d="M135,350 L135,560 L660,560 L660,200 L680,200" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M660,375 L680,375" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M660,485 L680,485" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="400" y="553" text-anchor="middle" font-size="12">same Record goes to every sink, so all numbers agree</text>

  <!-- Outputs -->
  <text x="865" y="320" text-anchor="middle" font-size="12" fill="#2e7d32">4. counters (low-cardinality labels)</text>
  <path d="M865,295 L865,310" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="440" y="575" width="260" height="30" rx="5" fill="#fff" stroke="#c62828"/>
  <text x="570" y="595" text-anchor="middle" font-size="12">metrics: OTel -> collector -> Prometheus</text>
  <path d="M1050,200 L1070,200 L1070,590 L700,590" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="800" y="575" width="0" height="0"/>
  <text x="1075" y="400" font-size="11" fill="#2e7d32" transform="rotate(90 1075 400)">push (OTLP)</text>
  <text x="865" y="437" text-anchor="middle" font-size="12" fill="#5e35b1">answers per-session, per-thread, per-request sums</text>
</svg>
