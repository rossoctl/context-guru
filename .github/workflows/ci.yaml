name: CI

on:
  push:
    branches: [main]
    paths-ignore: &non-go-paths
      # Markdown and the hand-written docs site. NOT examples/** — unlike docs.yaml's own
      # filter, this workflow's `go test ./...` genuinely exercises that directory
      # (github.com/rossoctl/context-guru/examples/llm-d-service/client shows up in its own
      # coverage output), so excluding it here would skip real Go code (#369).
      - "**/*.md"
      - docs/**
      - theme/**
      - mkdocs.yml
      - requirements-docs.txt
      - context-guru-plugin/skills/**/*.md
      - LICENSE
    # A tag push runs the heavy jobs too. GitHub does not apply the path filter to a tag.
    tags: ["v*"]
  pull_request:
    paths-ignore: *non-go-paths
  # Heavy jobs on demand: scripts/release/heavy-ci.sh, or "Run workflow" in the Actions tab.
  workflow_dispatch:
    inputs:
      per_test_times:
        description: "Write the 30 slowest tests to the job summary (runs go test -json)"
        type: boolean
        default: false
  # Tier 3 (RELEASING.md, "Heavy CI on main"): the heavy jobs every 3 hours, when main moved since the
  # last green heavy run. GitHub runs a cron only from the default branch.
  schedule:
    - cron: "17 */3 * * *"

# Cancel a PR run that a newer push to the same PR replaced. Push and schedule runs use the commit sha in the
# group, so each one has its own group. Without that, GitHub drops a queued run of the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Lean process (owner decision, 2026-11-24). A PR runs only the fast jobs: lint-build, purego, trivy.
# The heavy jobs (build-test, record) are tier 3. They run on workflow_dispatch, on a v* tag, and on
# the 3-hour schedule when main moved since the last green heavy run (job changed-since-green).
# Option E, approved by the owner on 2026-11-25. The integrator reads the result in the run summary
# and in the open issue "Heavy CI failed on main" (job report). See RELEASING.md, "Heavy CI on main".
jobs:
  # Decides if the scheduled run does any work. The other events always run the heavy jobs.
  changed-since-green:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/changed-since-green.sh "${{ github.event_name }}" "${{ github.sha }}" "${{ github.repository }}" \
            2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2) | tee -a "$GITHUB_OUTPUT"

  lint-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain. Pinning a literal here is
          # what let CI validate on 1.25 while go.mod declared 1.26.4 and releases built on
          # 1.26 (#152) — three numbers that have to agree and no mechanism making them.
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Build
        run: make build

  build-test:
    needs: changed-since-green
    if: needs.changed-since-green.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      # The integrator's run: the timing tests run here (testutil.RequireTiming).
      CG_TIMING_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The OpenCode plugin's timing tests run only here and in Part A. The opencode-plugin workflow
      # runs the rest of its tests on every PR, without CG_TIMING_TESTS.
      - name: OpenCode plugin timing tests
        run: node --test opencode-plugin/test/*.test.mjs
      - name: Test & coverage
        env:
          # The scheduled run always writes the time table: -json costs no extra test run. A dispatch
          # writes it only with per_test_times, so a manual run keeps its readable log.
          PER_TEST: ${{ github.event_name == 'schedule' || inputs.per_test_times }}
        run: |
          if [ "$PER_TEST" = true ]; then
            rc=0
            GOFLAGS=-json make cover > test.json 2>&1 || rc=$?
            # Make the log readable again, and write the 30 slowest tests (race, with -coverpkg).
            grep -v '^{' test.json || true
            jq -jR 'fromjson? | select(.Action=="output") | .Output' test.json
            {
              echo "### 30 slowest tests (go test -race -json, seconds)"
              echo '| s | package | test |'
              echo '| ---: | --- | --- |'
              jq -rR 'fromjson? | select(.Action=="pass" and .Test != null) | "\(.Elapsed)\t\(.Package)\t\(.Test)"' test.json \
                | sort -t"$(printf '\t')" -k1,1 -rn | head -30 | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}'
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" = 0 ] || exit "$rc"
          else
            make cover
          fi
          # Accurate cross-package total (statement-weighted) → PR/run job summary + log.
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Test coverage: ${total} (cross-package, statement-weighted)" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}"
      - name: Per-package coverage (log)
        # Derived from the coverage.out that `make cover` above already wrote, not a second
        # test run: this used to be `go test -cover ./...`, re-running the entire suite a
        # second time (without -race) purely to print these numbers — 5m29s of pure
        # duplication on a green run (#366).
        #
        # Not a byte-for-byte match for the old numbers, and that's a real semantic
        # difference, not a bug: `make cover` runs with -coverpkg=./..., so coverage.out
        # already has one entry per source block PER PACKAGE TESTED (~30x duplication for
        # a block in a widely-imported package), each recording whether THAT package's own
        # test run hit it. Deduping by block and summing hits across those duplicates gives
        # "was this line hit by anything in the whole suite" — cross-package coverage, not
        # each package's isolated self-coverage. For a package nothing else imports (e.g.
        # dash) the two are close (measured: 85.3% here vs 84.6% self-coverage). For one
        # widely imported (store, schema) this one is a few points higher, because other
        # packages' tests genuinely do exercise some of its code too — which is a more
        # honest "is this code covered" number, not a less accurate one.
        run: |
          awk 'NR==1{next} {
            n=split($1,a,":")
            key=$1
            cnt[key]+=$3
            nstmt[key]=$2
            path[key]=a[1]
          }
          END {
            for (k in cnt) {
              p=path[k]
              sub(/\/[^\/]*$/, "", p)
              total[p]+=nstmt[k]
              if (cnt[k]>0) covered[p]+=nstmt[k]
            }
            for (p in total) {
              pct = (total[p]>0) ? covered[p]/total[p]*100 : 0
              printf "%s\t%.1f%% of statements\n", p, pct
            }
          }' coverage.out | sort

  # The binary needs no C toolchain — asserted, not asserted-in-a-comment.
  #
  # Our own docs told every evaluator to install one (`docs/setup.md` even named bifrost's
  # tokenizer as a cgo dependency, which it never was). The only cgo dependency is tree-sitter,
  # behind the `cg_skeleton` build tag. Nothing checked that, and the `build-test` job above runs
  # exclusively with CGO_ENABLED=1 because `go test -race` requires it — so the configuration a
  # user would actually build was never exercised.
  #
  # CGO_ENABLED=0 is what does the work: with cgo off the toolchain never consults CC at all, so a
  # dependency that needs it fails to BUILD here rather than in a stranger's terminal. CC is pointed
  # at a nonexistent path anyway, as a tripwire for the day somebody sets CGO_ENABLED=1 in this job
  # and expects it to still be testing the same thing.
  purego:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CC: /nonexistent-c-compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain. Pinning a literal here is
          # what let CI validate on 1.25 while go.mod declared 1.26.4 and releases built on
          # 1.26 (#152) — three numbers that have to agree and no mechanism making them.
          go-version-file: go.mod
      - name: Build with no C compiler available
        run: |
          go build -o /tmp/cg-purego ./cmd/context-guru-proxy
          file /tmp/cg-purego | tee /dev/stderr | grep -q "statically linked"
      - name: It has to start, not just link
        run: |
          LISTEN_ADDR=127.0.0.1:4471 CONTEXT_GURU_KEEPALIVE=off /tmp/cg-purego &
          for _ in $(seq 1 40); do
            sleep 0.25
            curl -fsS http://127.0.0.1:4471/healthz && break
          done
          curl -fsS http://127.0.0.1:4471/healthz | grep -q ok
      # And the guard that matters most to a CGO-free build: a preset naming a component which is
      # not registered without cgo starts the proxy and then fails at pipeline build. That is the
      # `preset: coding` / `unknown component "skeleton"` breakage, and TestEveryPresetBuilds
      # covers it — but it had never run in this configuration.
      # -p 1: run one package binary at a time.
      #
      # A CI runner has 2 cores, and `go test` otherwise starts up to GOMAXPROCS package binaries
      # in parallel. Adding this job therefore added a SECOND heavily-parallel run of the proxy
      # package per PR, and under that contention a timing-sensitive control-plane test
      # (TestCtlGetCampaignAggregatesPredictedAndRealPerTenant — rossoctl/context-guru#163) failed
      # twice on unrelated PRs, then passed on re-run and passes 3/3 locally on main and on the
      # branch. That flake is not this job's business to hunt, but it IS this job's business not to
      # provoke it: serialising costs about a minute and removes the contention this job added.
      - name: Test the packages whose behaviour depends on which components compile in
        run: go test -timeout 40m -p 1 ./config/... ./components/... ./apply/... ./proxy/... ./store/...

  # The session recorder (--record, --record-otlp) is only in a build with -tags cg_record.
  # The default build must stay free of OpenTelemetry, gRPC and protobuf (they add 11.5 MB).
  # Both variants are built and tested here. The guard test runs in the untagged `go test`.
  record:
    needs: changed-since-green
    if: needs.changed-since-green.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # The integrator's run: the timing tests run here (testutil.RequireTiming).
      CG_TIMING_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Default build links no OpenTelemetry, gRPC or protobuf
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
          go test -run TestDefaultBuildLinksNoOpenTelemetryGRPCOrProtobuf ./proxyapp/
      - name: Build and vet with the recorder
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags cg_record ./...
          go vet -tags cg_record ./...
      - name: Test with the recorder (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 40m -tags cg_record -p 1 ./proxy/... ./internal/record/... ./tenant/... ./proxyapp/...

  # Posts the scheduled heavy run's result where the integrator looks: the run summary, and ONE issue
  # titled "Heavy CI failed on main". A red run opens it, or adds a comment when it is open. A green
  # run closes it. Only this job has issues: write.
  report:
    needs: [changed-since-green, build-test, record]
    if: always() && github.event_name == 'schedule' && needs.changed-since-green.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_TEST: ${{ needs.build-test.result }}
      RECORD: ${{ needs.record.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Summary, and the one issue
        run: |
          title="Heavy CI failed on main"
          {
            echo "### Heavy CI (tier 3) on \`${SHA:0:12}\`"
            echo "- build-test: **$BUILD_TEST**"
            echo "- record: **$RECORD**"
          } >> "$GITHUB_STEP_SUMMARY"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | first | .number // empty")
          if [ "$BUILD_TEST" = success ] && [ "$RECORD" = success ]; then
            [ -z "$open" ] || gh issue close "$open" --comment "Green again on \`${SHA:0:12}\`: $RUN_URL"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The scheduled heavy run failed on main at \`$SHA\`."
            echo
            echo "- build-test: **$BUILD_TEST**"
            echo "- record: **$RECORD**"
            echo "- Run: $RUN_URL"
            echo
            echo "Fix forward with a new PR (RELEASING.md, \"Heavy CI on main\")."
          } > "$body"
          if [ -n "$open" ]; then gh issue comment "$open" --body-file "$body"
          else gh issue create --title "$title" --body-file "$body"; fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
