name: OpenCode plugin

# Node tests for opencode-plugin/, and the Python tests of its one-command installer. Decoupled from ci.yaml, like docs.yaml: no Go, no CGO. It runs
# only when the plugin, its test, or this file changes. The tests use stub proxies and no network.

on:
  push:
    branches: [main]
    paths:
      - opencode-plugin/**
      - .github/workflows/opencode-plugin.yaml
  pull_request:
    paths:
      - opencode-plugin/**
      - .github/workflows/opencode-plugin.yaml

# Cancel a PR run that a newer push replaced. Push and schedule runs use the commit sha in the
# group, so each one has its own group. Without that, GitHub drops a queued run of the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check opencode-plugin/index.js && node --check opencode-plugin/tui.js
      - run: node --test opencode-plugin/test/*.test.mjs
      - run: python3 -m unittest discover -s opencode-plugin/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s opencode-plugin/release -p 'test_*.py'
